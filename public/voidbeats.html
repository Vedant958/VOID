    // ─────────────────────────────────────────────────────────────
    // HOME DISCOVERY ENGINE (Personalized feed: History -> Recs -> Likes -> Cold start)
    // Pure display — NEVER mutates active queue until a card action is clicked
    // ─────────────────────────────────────────────────────────────
    let homeDiscoveryToken = 0;
    window.homeDiscovery = { recent: [], recommended: [], moreLike: [], loading: false };

    function uniqueHomeTracks(tracks, excluded = new Set()) {
      const seen = new Set(excluded);
      const queueKeys = new Set((window.playQueue || []).map(trackIdentity));
      return (tracks || []).filter(track => {
        const key = trackIdentity(track);
        if (!key || seen.has(key) || queueKeys.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    async function fetchColdStartTracks() {
      try {
        const res = await fetch('https://itunes.apple.com/search?term=electronic%20music&entity=song&limit=12');
        if (!res.ok) return [];
        const data = await res.json();
        return (data.results || []).map(item => ({
          id: String(item.trackId || Math.random().toString(36).slice(2)),
          title: item.trackName || 'Unknown Track',
          artist: item.artistName || 'Unknown Artist',
          duration: formatTime((item.trackTimeMillis || 0) / 1000),
          cover: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '600x600bb') : FALLBACK_COVER,
          previewUrl: item.previewUrl || ''
        }));
      } catch (_) { return []; }
    }

    async function loadHomeDiscovery() {
      const token = ++homeDiscoveryToken;
      const history = loadListeningHistory();
      const recent = history.slice(0, 8);
      const historySeeds = getHomeSeedsFromHistory(3);
      const liked = loadLikedTracks() || [];
      window.homeDiscovery = { recent, recommended: [], moreLike: [], loading: true };
      renderHomeDiscovery();

      // Priority:
      // A. Recently played / history seeds
      // B. Last.fm recommendations based on history
      // C. Liked artists/tracks as supplemental signals
      // D. Cold-start fallback for users with insufficient history
      const collected = [];
      for (const seed of historySeeds) {
        try {
          const recs = await fetchSimilarTracksRadio(seed);
          if (Array.isArray(recs)) collected.push(...recs);
        } catch (_) {}
        if (collected.length >= 16) break;
      }

      if (collected.length < 16 && liked.length > 0) {
        for (const seed of liked.slice(0, 2)) {
          try {
            const recs = await fetchSimilarTracksRadio(seed);
            if (Array.isArray(recs)) collected.push(...recs);
          } catch (_) {}
          if (collected.length >= 20) break;
        }
      }

      if (collected.length < 8) {
        try {
          const cold = await fetchColdStartTracks();
          if (Array.isArray(cold)) collected.push(...cold);
        } catch (_) {}
      }

      if (token !== homeDiscoveryToken) return;

      const recentKeys = new Set(recent.map(trackIdentity));
      const discovery = uniqueHomeTracks(collected, recentKeys);
      window.homeDiscovery = {
        recent,
        recommended: discovery.slice(0, 8),
        moreLike: discovery.slice(8, 16),
        loading: false
      };
      renderHomeDiscovery();
    }
    window.loadHomeDiscovery = loadHomeDiscovery;

    function homeCardMarkup(track, compact = false) {
      const cover = esc(track.cover || FALLBACK_COVER);
      return `<article class="home-track-card ${compact ? 'min-w-[210px]' : ''} rounded-xl border border-white/[0.07] bg-white/[0.025] p-2.5">
        <div class="flex items-center gap-2.5 min-w-0">
          <img src="${cover}" class="w-10 h-10 rounded-lg object-cover bg-neutral-900" onerror="this.src='${FALLBACK_COVER}'" alt="">
          <div class="min-w-0 flex-1"><div class="text-xs font-semibold text-white truncate">${esc(track.title)}</div><div class="text-[11px] text-neutral-500 truncate">${esc(track.artist)}</div></div>
        </div>
        <div class="mt-2 flex gap-1.5"><button class="home-play flex-1 rounded-md bg-emerald-500 hover:bg-emerald-400 px-2 py-1 text-[10px] font-mono font-bold text-black transition" type="button">PLAY</button><button class="home-add rounded-md border border-white/10 hover:border-emerald-500/40 px-2 py-1 text-[10px] font-mono text-neutral-300 transition" type="button">+ QUEUE</button></div>
      </article>`;
    }

    function bindHomeCards(container, tracks) {
      container.querySelectorAll('.home-track-card').forEach((card, index) => {
        const track = tracks[index];
        if (!track) return;
        card.querySelector('.home-play')?.addEventListener('click', () => playTrackAndStartRadio(track));
        card.querySelector('.home-add')?.addEventListener('click', () => {
          const added = addTrackToQueue(track);
          const btn = card.querySelector('.home-add');
          if (btn && added) {
            btn.textContent = 'ADDED';
            btn.classList.add('text-emerald-400', 'border-emerald-500/40');
            setTimeout(() => {
              btn.textContent = '+ QUEUE';
              btn.classList.remove('text-emerald-400', 'border-emerald-500/40');
            }, 1200);
          }
        });
      });
    }

    function renderHomeDiscovery() {
      if (!playlistBox || isSearchMode) return;
      const home = window.homeDiscovery || { recent: [], recommended: [], moreLike: [], loading: false };
      const groups = [
        ['RECENTLY PLAYED', home.recent],
        ['RECOMMENDED FOR YOU', home.recommended],
        ['MORE LIKE WHAT YOU LISTEN TO', home.moreLike]
      ].filter(([, tracks]) => tracks.length > 0);
      playlistBox.innerHTML = home.loading && groups.length === 0
        ? '<div class="p-6 text-center text-xs font-mono text-neutral-500 animate-pulse">// BUILDING YOUR DISCOVERY FEED...</div>'
        : (groups.length ? groups.map(([title, tracks]) => `<section class="mb-5"><h3 class="mb-2 text-[10px] font-mono tracking-widest text-emerald-400">// ${title}</h3><div class="grid grid-cols-1 gap-2">${tracks.map(track => homeCardMarkup(track)).join('')}</div></section>`).join('') : '<div class="p-6 text-center text-xs font-mono text-neutral-500">// LISTEN TO A TRACK TO PERSONALIZE YOUR FEED</div>');
      bindHomeCards(playlistBox, groups.flatMap(([, tracks]) => tracks));
      if (trackCountEl) trackCountEl.textContent = 'DISCOVERY';
    }
    window.renderHomeDiscovery = renderHomeDiscovery;

    function updatePlaylistActiveState(activeIdx) {
      const rows = playlistBox?.querySelectorAll('.playlist-track-row');
      if (!rows) return;
      rows.forEach((row, i) => {
        const isCur = i === activeIdx;
        row.classList.toggle('bg-emerald-500/10', isCur);
        row.classList.toggle('border-emerald-500/30', isCur);

        // Title colour
        const titleEl = row.querySelector('.text-sm');
        if (titleEl) {
          titleEl.classList.toggle('text-emerald-400', isCur);
          titleEl.classList.toggle('text-white', !isCur);
        }
        // Duration colour
        const durEl = row.querySelector('.font-mono');
        if (durEl) {
          durEl.classList.toggle('text-emerald-400', isCur);
          durEl.classList.toggle('text-neutral-500', !isCur);
        }
        // Active dot overlay — inject if missing, remove if not current
        const thumb = row.querySelector('.relative.w-10');
        if (thumb) {
          let dot = thumb.querySelector('.active-track-dot-wrap');
          if (isCur && !dot) {
            dot = document.createElement('div');
            dot.className = 'active-track-dot-wrap absolute inset-0 bg-black/40 flex items-center justify-center';
            dot.innerHTML = '<span class="active-track-dot w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>';
            thumb.appendChild(dot);
          } else if (!isCur && dot) {
            dot.remove();
          }
        }
      });
      // Also keep currentIndex in sync so renderTracksList re-highlights correctly
      currentIndex = activeIdx;
    }

    // ─────────────────────────────────────────────────────────────
    // DIRECT PLAYBACK ENGINE (Dedicated deckAudio, NO BG Audio Hijack)
    // ─────────────────────────────────────────────────────────────
    let audioResolverToken = 0;

    async function playTrackDirect(track) {
      if (!track) return;
      const thisToken = ++audioResolverToken;

      window.currentActiveTrack = track;
      if (typeof updateLikeUI === 'function') updateLikeUI(track);
      if (typeof updateMediaSessionMetadata === 'function') updateMediaSessionMetadata(track);

      // 1. Immediately mute/pause any background site audio
      if (window.backgroundAmbientAudio) {
        try { window.backgroundAmbientAudio.pause(); } catch(e) {}
      }
      const coreAudio = document.getElementById('void-core-audio') || document.getElementById('bg-music');
      if (coreAudio) {
        try { coreAudio.pause(); } catch(e) {}
      }

      // 2. Immediately update deck left panel metadata
      if (mainTitle) mainTitle.textContent = track.title;
      if (mainArtist) mainArtist.textContent = track.artist;
      if (totalTimeEl) totalTimeEl.textContent = track.duration || '03:45';
      resetScrubber();

      // Active Playback Cover Sync:
      const cleanArtKey = `${(track.title || '').replace(/\(.*?\)|\[.*?\]/g, '').trim().toLowerCase()}||${(track.artist || '').replace(/\(.*?\)|\[.*?\]/g, '').trim().toLowerCase()}`;
      const cachedArt = (!isMissingOrPlaceholderCover(track.cover))
        ? track.cover
        : (artworkCache.get(cleanArtKey) || null);

      if (cachedArt) {
        track.cover = cachedArt;
        if (mainCover) mainCover.src = cachedArt;
        if (typeof updateMediaSessionMetadata === 'function') updateMediaSessionMetadata(track);
      } else {
        if (mainCover) {
          mainCover.src = track.cover || FALLBACK_COVER;
          mainCover.onerror = () => { mainCover.src = FALLBACK_COVER; };
        }
        // Fetch on the fly so cover/spinning vinyl never remains blank
        fetchTrackArtwork(track.title, track.artist).then(hdUrl => {
          if (hdUrl) {
            track.cover = hdUrl;
            if (mainCover && thisToken === audioResolverToken) mainCover.src = hdUrl;
            const curIdx = window.currentQueueIndex || 0;
            const qImg = document.querySelector(`#queue-items-list [data-qi="${curIdx}"] img, #queue-items-list .queue-item-row:nth-child(${curIdx + 1}) img`);
            if (qImg) qImg.src = hdUrl;
            if (typeof updateMediaSessionMetadata === 'function' && window.currentActiveTrack === track) {
              updateMediaSessionMetadata(track);
            }
          }
        });
      }

      updatePlaylistActiveState(window.currentTrackIndex);
      const started = await resolveAndPlayStream(track);
      if (started) {
        recordListeningStart(track);
        if (!isSearchMode && typeof renderHomeDiscovery === 'function') {
          renderHomeDiscovery();
        }
      }
    }
    window.playSelectedTrack = playTrackDirect;
    const playSelectedTrack = playTrackDirect;

    // ─────────────────────────────────────────────────────────────
    // 1. ROBUST STREAM RESOLUTION WITH MULTI-SOURCE FALLBACK
    // ─────────────────────────────────────────────────────────────
    async function resolveAndPlayStream(track) {
      const thisToken = ++audioResolverToken;

      // Direct local audio path for track 01 / CYBER_DRIFT_808
      if (track.id === '1' || track.id === '01' || track.title === 'CYBER_DRIFT_808' || track.isLocal) {
        player.src = track.src || 'music.mp3';
        player.currentTime = 0;
        try {
          await player.play();
          updateButtonVisual(true);
          return true;
        } catch (e) {
          console.error(e);
          return false;
        }
      }

      try {
        const searchStr = track.query || `${track.title} ${track.artist}`;
        const cleanQuery = encodeURIComponent(searchStr.replace(/[^\w\s]/gi, ' ').replace(/\s+/g, ' ').trim());
        let candidate = null;
        try {
          const resMirror = await fetch(`https://saavn-api-one.vercel.app/search/songs?query=${cleanQuery}`);
          if (resMirror.ok) {
            const dataMirror = await resMirror.json();
            candidate = dataMirror.data?.results?.[0] || (Array.isArray(dataMirror.data) ? dataMirror.data[0] : null);
          }
        } catch (e) {}

        // Fallback mirror if needed
        if (!candidate) {
          try {
            const res = await fetch(`https://saavn.dev/api/search/songs?query=${cleanQuery}&limit=3`);
            if (res.ok) {
              const data = await res.json();
              candidate = data.data?.results?.[0];
            }
          } catch(e) {}
        }

        let streamUrl = null;
        if (candidate && candidate.downloadUrl) {
          // Find direct 320kbps or 160kbps MP3 link
          const best = candidate.downloadUrl.find(q => q.quality === '320kbps') || candidate.downloadUrl.slice(-1)[0];
          streamUrl = best?.url || best?.link || (typeof best === 'string' ? best : null);
        }

        // Safety fallback
        if (!streamUrl && track.previewUrl) {
          streamUrl = track.previewUrl;
        }

        // Safety fallback: iTunes 30s preview
        if (!streamUrl) {
          try {
            const itunesRes = await fetch(`https://itunes.apple.com/search?term=${cleanQuery}&entity=song&limit=1`);
            if (itunesRes.ok) {
              const itunesData = await itunesRes.json();
              if (itunesData.results?.[0]?.previewUrl) {
                streamUrl = itunesData.results[0].previewUrl;
                track.previewUrl = streamUrl;
              }
            }
          } catch(e) {}
        }

        // Local track fallback
        if (!streamUrl && (track.src || track.url)) {
          streamUrl = track.src || track.url;
        }
        if (!streamUrl) {
          streamUrl = 'music.mp3';
        }

        if (!streamUrl) throw new Error("No playable stream");

        if (thisToken !== audioResolverToken) return false;

        // Force clean audio element refresh
        player.pause();
        player.removeAttribute('src');
        player.load();

        // CRITICAL: crossOrigin MUST be set BEFORE src assignment.
        // Setting it after src causes browser to lock in a non-CORS request mode,
        // making the WebAudio graph output silence even though the element plays.
        player.crossOrigin = "anonymous";
        player.muted = false;
        player.volume = 0.9;
        // Always ensure loop is off — a previous track state may have left it on
        player.loop = false;

        // Use HTTPS directly
        player.src = streamUrl.replace(/^http:\/\//i, 'https://');

        // Resume AudioContext if suspended by autoplay policy
        if (window._voidAudioCtx && window._voidAudioCtx.state === 'suspended') {
          window._voidAudioCtx.resume();
        }

        await player.play();
        console.log("// AUDIO PLAYING AT VOLUME:", player.volume, "MUTED:", player.muted, "SRC:", player.src);
        updateButtonVisual(true);
        return true;

      } catch (err) {
        console.error("// STREAM ERROR:", err);
        // Last-ditch: drop crossOrigin restriction (some CDNs block anonymous)
        try {
          player.crossOrigin = null;
          player.muted = false;
          player.volume = 0.9;
          await player.play();
          console.log("// AUDIO PLAYING (no-cors fallback)");
          updateButtonVisual(true);
          return true;
        } catch(e2) {
          updateButtonVisual(false);
          return false;
        }
      }
    }

    // ─────────────────────────────────────────────────────────────
    // TIMELINE, SCRUBBER & DURATION BINDINGS
    // ─────────────────────────────────────────────────────────────
    function resetScrubber() {
      const progressBar = document.getElementById('audio-progress-bar');
      const scrubThumb = document.getElementById('scrubber-thumb');
      const currentTimeEl = document.getElementById('current-time-display');
      if (progressBar) progressBar.style.width = '0%';
      if (scrubThumb) scrubThumb.style.left = '0%';
      if (currentTimeEl) currentTimeEl.innerText = '00:00';
    }

    // 3. Connect Timer Directly to Native timeupdate
    player.ontimeupdate = () => {
      if (!player.duration || isNaN(player.duration)) return;

      if (typeof updateMediaSessionPositionState === 'function') {
        updateMediaSessionPositionState();
      }

      const cur = Math.floor(player.currentTime);
      const dur = Math.floor(player.duration);

      const curMin = Math.floor(cur / 60);
      const curSec = cur % 60;
      const durMin = Math.floor(dur / 60);
      const durSec = dur % 60;

      const curEl = document.getElementById('current-time-display');
      const durEl = document.getElementById('total-duration-display');
      const bar = document.getElementById('audio-progress-bar');
      const thumb = document.getElementById('scrubber-thumb');

      if (curEl) curEl.innerText = `${curMin}:${curSec < 10 ? '0' : ''}${curSec}`;
      if (durEl) durEl.innerText = `${durMin}:${durSec < 10 ? '0' : ''}${durSec}`;
      if (bar) bar.style.width = `${(cur / dur) * 100}%`;
      if (thumb) thumb.style.left = `${(cur / dur) * 100}%`;
    };

    // 2. Bulletproof Play/Pause Button Logic
    function updateButtonVisual(isPlaying) {
      const btn = document.getElementById('play-pause-btn');
      if (!btn) return;

      if (isPlaying) {
        btn.innerHTML = `
          <svg class="w-6 h-6 fill-current text-black" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>`;
      } else {
        btn.innerHTML = `
          <svg class="w-6 h-6 fill-current text-black translate-x-0.5" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>`;
      }

      const statusText = document.getElementById('deck-status-text');
      if (statusText) statusText.textContent = isPlaying ? 'Playing' : 'Paused';
    }

    const updatePlayPauseUI = updateButtonVisual;
    const syncPlaybackUI = updateButtonVisual;

    // Master Toggle Handler
    if (playBtn) {
      playBtn.onclick = (e) => {
        e.stopPropagation();
        if (!player.src) {
          const candidate = (window.playQueue && window.playQueue[window.currentQueueIndex || 0])
            || (window.homeDiscovery?.recent?.[0])
            || (window.homeDiscovery?.recommended?.[0]);
          if (candidate) {
            playTrackAndStartRadio(candidate);
          }
          return;
        }

        if (player.paused) {
          player.play().then(() => updateButtonVisual(true)).catch(console.error);
        } else {
          player.pause();
          updateButtonVisual(false);
        }
      };
    }

    player.onplay = () => {
      updateButtonVisual(true);
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = 'playing';
      }
    };
    player.onpause = () => {
      updateButtonVisual(false);
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = 'paused';
      }
    };

    function toggleDeckPlayback() {
      if (playBtn) playBtn.click();
    }
    function togglePlay() {
      toggleDeckPlayback();
    }
    window.toggleVoidPlayback = toggleDeckPlayback;
    window.playSelectedTrack = playTrackDirect;

    // ─────────────────────────────────────────────────────────────
    // 4. ADVANCE QUEUE ON AUDIO END (SPOTIFY SONG RADIO)
    // ─────────────────────────────────────────────────────────────
    let isFetchingQueueRecommendations = false;

    async function playNextTrack() {
      if (isLooping) {
        player.currentTime = 0;
        player.play().catch(console.error);
        return;
      }

      if (isFetchingQueueRecommendations) return;

      window.currentQueueIndex++;
      window.currentTrackIndex = window.currentQueueIndex;

      if (window.currentQueueIndex < window.playQueue.length) {
        const nextSong = window.playQueue[window.currentQueueIndex];
        console.log("// RADIO NEXT:", nextSong.title);

        const cleanKey = `${(nextSong?.title || '').replace(/\(.*?\)|\[.*?\]/g, '').trim().toLowerCase()}||${(nextSong?.artist || '').replace(/\(.*?\)|\[.*?\]/g, '').trim().toLowerCase()}`;
        const cached = nextSong?.cover && !isMissingOrPlaceholderCover(nextSong.cover)
          ? nextSong.cover
          : (artworkCache.get(cleanKey) || null);
        const coverEl = document.getElementById('album-cover-img') || mainCover;
        if (cached && coverEl) {
          coverEl.src = cached;
          if (nextSong) nextSong.cover = cached;
        }

        playSelectedTrack(nextSong);
        if (typeof renderQueueView === 'function') renderQueueView();
        if (window.currentQueueIndex + 1 >= window.playQueue.length) {
          ensureUpcomingQueueTracks(nextSong);
        }
      } else if (window.playQueue.length > 0) {
        const lastSong = window.playQueue[window.playQueue.length - 1];
        if (lastSong) {
          isFetchingQueueRecommendations = true;
          try {
            if (typeof showQueueLoading === 'function') showQueueLoading();
            const moreTracks = await fetchSimilarTracksRadio(lastSong.title, lastSong.artist);
            const uniqueNewTracks = deduplicateTracksAgainstQueue(moreTracks);

            if (uniqueNewTracks.length > 0) {
              console.log(`// RADIO: Appended ${uniqueNewTracks.length} unique tracks to queue.`);
              window.playQueue.push(...uniqueNewTracks);
              playSelectedTrack(window.playQueue[window.currentQueueIndex]);
              hydrateQueueArtwork();
            } else {
              console.log('// RADIO: No unseen recommendations found from last track. Gracefully looping queue to start.');
              window.currentQueueIndex = 0;
              window.currentTrackIndex = 0;
              playSelectedTrack(window.playQueue[0]);
            }
          } catch (err) {
            console.warn('// Error fetching radio at queue end:', err);
            window.currentQueueIndex = 0;
            window.currentTrackIndex = 0;
            if (window.playQueue.length > 0) {
              playSelectedTrack(window.playQueue[0]);
            }
          } finally {
            isFetchingQueueRecommendations = false;
            if (typeof renderQueueView === 'function') renderQueueView();
          }
        }
      }
    }
    window.playNextTrack = playNextTrack;

    function playPreviousTrack() {
      if (window.currentQueueIndex > 0) {
        window.currentQueueIndex--;
        window.currentTrackIndex = window.currentQueueIndex;
        const prevSong = window.playQueue[window.currentQueueIndex];

        const cleanKey = `${(prevSong?.title || '').replace(/\(.*?\)|\[.*?\]/g, '').trim().toLowerCase()}||${(prevSong?.artist || '').replace(/\(.*?\)|\[.*?\]/g, '').trim().toLowerCase()}`;
        const cached = prevSong?.cover && !isMissingOrPlaceholderCover(prevSong.cover)
          ? prevSong.cover
          : (artworkCache.get(cleanKey) || null);
        const coverEl = document.getElementById('album-cover-img') || mainCover;
        if (cached && coverEl) {
          coverEl.src = cached;
          if (prevSong) prevSong.cover = cached;
        }

        playSelectedTrack(prevSong);
        if (typeof renderQueueView === 'function') renderQueueView();
      }
    }
    window.playPreviousTrack = playPreviousTrack;

    player.onended = playNextTrack;

    // Next Button UI Click
    const nextBtn = document.querySelector('button[aria-label="Next"]') || document.getElementById('next-track-btn') || document.getElementById('ctrl-next');
    if (nextBtn) {
      nextBtn.onclick = (e) => {
        e.stopPropagation();
        playNextTrack();
      };
    }

    // Prev Button UI Click
    const prevBtn = document.querySelector('button[aria-label="Previous"]') || document.getElementById('prev-track-btn') || document.getElementById('ctrl-prev');
    if (prevBtn) {
      prevBtn.onclick = (e) => {
        e.stopPropagation();
        playPreviousTrack();
      };
    }

    // Scrubber Click-to-Seek Handler
    const progressTrack = document.getElementById('progress-bar-container') || document.getElementById('progress-track-container') || document.querySelector('.scrubber-track');
    if (progressTrack) {
      progressTrack.onclick = (e) => {
        if (!player.duration) return;
        const rect = progressTrack.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const percent = Math.max(0, Math.min(1, clickX / rect.width));
        player.currentTime = percent * player.duration;
      };
    }

    if (ctrlLoop) {
      ctrlLoop.addEventListener('click', () => {
        isLooping = !isLooping;
        // Sync both the JS flag AND the native element loop attribute
        player.loop = isLooping;
        deckAudio.loop = isLooping;
        ctrlLoop.classList.toggle('text-emerald-400', isLooping);
        ctrlLoop.classList.toggle('text-neutral-400', !isLooping);
        ctrlLoop.title = isLooping ? 'Repeat: On' : 'Repeat: Off';
      });
    }

    if (ctrlShuffle) {
      ctrlShuffle.addEventListener('click', () => {
        isShuffle = !isShuffle;
        ctrlShuffle.classList.toggle('text-emerald-400', isShuffle);
        ctrlShuffle.classList.toggle('text-neutral-400', !isShuffle);
        ctrlShuffle.title = isShuffle ? 'Shuffle: On' : 'Shuffle: Off';
      });
    }

    if (volSlider) {
      volSlider.oninput = (e) => {
        player.volume = parseFloat(e.target.value) / 100;
        if (volLabel) volLabel.textContent = `${e.target.value}%`;
      };
    }

    // Intercept Spacebar globally for VOID_BEATS ONLY (Prevent default page scroll & ghost tracks)
    document.addEventListener('keydown', (e) => {
      // Ignore spacebar if user is typing in the search input
      const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (activeTag === 'input' || activeTag === 'textarea') return;

      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        toggleDeckPlayback();
      }
    });

    // ─────────────────────────────────────────────────────────────
    // SEARCH & FILTER INPUT HANDLING
    // ─────────────────────────────────────────────────────────────
    if (searchInput) {
      searchInput.addEventListener('input', () => {
        if (searchInput.value.trim().length === 0 && isSearchMode) {
          exitSearchMode();
        }
      });
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const q = searchInput.value.trim();
          if (q.length > 0) {
            executeGlobalSearch(q);
          } else {
            exitSearchMode();
          }
        }
        if (e.key === 'Escape') {
          searchInput.value = '';
          exitSearchMode();
        }
      });
    }

    function exitSearchMode() {
      isSearchMode = false;
      if (searchInput) searchInput.value = '';
      if (typeof renderHomeDiscovery === 'function') {
        renderHomeDiscovery();
      }
    }
    window.exitSearchMode = exitSearchMode;

    filterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        filterTabs.forEach(t => {
          t.classList.remove('bg-white', 'text-black', 'font-semibold');
          t.classList.add('bg-neutral-900', 'border', 'border-neutral-800', 'text-neutral-400');
        });
        tab.classList.add('bg-white', 'text-black', 'font-semibold');
        tab.classList.remove('bg-neutral-900', 'border', 'border-neutral-800', 'text-neutral-400');

        activeFilter = tab.dataset.filter || 'all';
        if (activeFilter === 'all') {
          exitSearchMode();
        } else {
          executeGlobalSearch(activeFilter + ' music');
        }
      });
    });

    // ─────────────────────────────────────────────────────────────
    // VISUALIZER (Zero CORS Mathematical Audio Waveform)
    // ─────────────────────────────────────────────────────────────
    const canvas = document.getElementById('deck-visualizer-canvas');
    const vCtx   = canvas?.getContext('2d') || null;

    function resizeCanvas() {
      if (!canvas) return;
      canvas.width  = canvas.parentElement?.clientWidth || 300;
      canvas.height = 70;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderVisualizer() {
      requestAnimationFrame(renderVisualizer);
      if (!vCtx || !canvas) return;
      const W = canvas.width, H = canvas.height;
      vCtx.clearRect(0, 0, W, H);

      const isPlaying = !deckAudio.paused && deckAudio.currentTime > 0;
      const t = Date.now() * (isPlaying ? 0.005 : 0.0015);
      const amp = isPlaying ? 16 : 4;

      vCtx.beginPath();
      vCtx.lineWidth = 1.75;
      vCtx.strokeStyle = isPlaying ? '#10b981' : 'rgba(16, 185, 129, 0.4)';
      vCtx.shadowBlur = isPlaying ? 10 : 3;
      vCtx.shadowColor = 'rgba(16, 185, 129, 0.5)';

      for (let x = 0; x < W; x += 2) {
        const y = H / 2
          + Math.sin(x * 0.04 + t) * amp * Math.abs(Math.sin(t * 0.6))
          + Math.cos(x * 0.08 + t * 1.5) * (amp * 0.45);
        if (x === 0) vCtx.moveTo(x, y);
        else vCtx.lineTo(x, y);
      }
      vCtx.stroke();
      vCtx.shadowBlur = 0;
    }
    renderVisualizer();

    // ─────────────────────────────────────────────────────────────
    // BOOT & INITIAL TRACK LOAD
    // ─────────────────────────────────────────────────────────────
    async function boot() {
      // 1. Initialize hardware MediaSession handlers and storage state
      if (typeof initMediaSessionHandlers === 'function') initMediaSessionHandlers();
      if (typeof loadLikedTracks === 'function') loadLikedTracks();
      if (typeof loadCustomPlaylists === 'function') loadCustomPlaylists();
      if (typeof loadListeningHistory === 'function') loadListeningHistory();

      // 2. Populate Home Discovery feed dynamically (never touches active queue)
      await loadHomeDiscovery();

      // 3. Populate idle deck preview display from first discovery track without autoplaying
      const seedPreview = (window.homeDiscovery?.recent?.[0]) || (window.homeDiscovery?.recommended?.[0]);
      if (seedPreview) {
        window.currentActiveTrack = seedPreview;
        if (mainTitle) mainTitle.textContent = seedPreview.title;
        if (mainArtist) mainArtist.textContent = seedPreview.artist;
        if (mainCover) mainCover.src = seedPreview.cover || FALLBACK_COVER;
        if (totalTimeEl) totalTimeEl.textContent = seedPreview.duration || '03:30';
        if (typeof updateLikeUI === 'function') updateLikeUI(seedPreview);
        if (typeof updateMediaSessionMetadata === 'function') updateMediaSessionMetadata(seedPreview);
      }

      // 4. Update initial queue counter
      if (typeof updateQueueCounter === 'function') updateQueueCounter();

      // Initialize hardware MediaSession handlers and Like/Playlist state
      if (typeof initMediaSessionHandlers === 'function') initMediaSessionHandlers();
      if (typeof loadLikedTracks === 'function') loadLikedTracks();
      if (typeof loadCustomPlaylists === 'function') loadCustomPlaylists();

      const likeBtn = document.getElementById('void-like-btn');
      if (likeBtn) {
        likeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const activeTrack = window.currentActiveTrack || (window.playQueue && window.playQueue[window.currentQueueIndex]);
          if (activeTrack && typeof toggleLikeTrack === 'function') {
            toggleLikeTrack(activeTrack);
          }
        });
      }

      const addPlBtn = document.getElementById('void-add-to-pl-btn');
      if (addPlBtn) {
        addPlBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const activeTrack = window.currentActiveTrack || (window.playQueue && window.playQueue[window.currentQueueIndex]);
          if (activeTrack && typeof openPlaylistPicker === 'function') {
            openPlaylistPicker(activeTrack);
          } else {
            alert('No track currently selected.');
          }
        });
      }
    }

    boot();
  })();
  </script>
