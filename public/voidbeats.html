<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta name="description" content="VOID // VOID_BEATS — Sleek Dark Minimalist Audio Deck."/>
  <title>VOID_BEATS // Modern Audio Deck</title>
  
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-void.png">
  <link rel="shortcut icon" type="image/png" href="assets/icon-void.png">

  <!-- Typography & Icons -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS Framework -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "emerald-accent": "#10b981",
            "deck-bg": "#0b0b0f",
            "deck-surface": "#121216",
            "deck-card": "#17171d",
            "deck-border": "rgba(255, 255, 255, 0.08)"
          },
          fontFamily: {
            "sans": ["Inter", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
            "display": ["Space Grotesk", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #070709;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Razor-thin transparent custom scrollbar */
    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Range slider custom styling */
    input[type="range"] {
      accent-color: #10b981;
    }

    /* Scrubber hover thumb */
    .scrubber-track:hover .scrubber-thumb {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.2);
    }

    /* Vinyl artwork glow */
    .album-vinyl-glow {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(11, 11, 15, 0.8) 100%);
      pointer-events: none;
    }

    /* ── Deck Tab Switcher ── */
    .deck-tab {
      position: relative;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
      border: 1px solid transparent;
      color: #6b7280;
      background: transparent;
      letter-spacing: 0.03em;
    }
    .deck-tab:hover {
      color: #e5e7eb;
    }
    .deck-tab.active {
      background: rgba(255,255,255,0.07);
      color: #ffffff;
      border-color: rgba(255,255,255,0.1);
    }
    .deck-tab.active-queue {
      background: rgba(16,185,129,0.08);
      color: #10b981;
      border-color: rgba(16,185,129,0.25);
    }

    /* Queue counter badge pulse */
    #queue-counter {
      transition: opacity 0.3s;
    }
    #queue-counter.has-items {
      animation: qpulse 2s ease-in-out infinite;
    }
    @keyframes qpulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.3); }
      50%       { box-shadow: 0 0 0 4px rgba(16,185,129,0); }
    }

    /* Queue item row */
    .queue-item-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
    }
    .queue-item-row:hover {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.06);
    }
    .queue-item-row.is-now-playing {
      background: rgba(16,185,129,0.07);
      border-color: rgba(16,185,129,0.22);
    }
    .queue-item-row.is-now-playing .q-title {
      color: #10b981;
    }
    .queue-item-row .q-index {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #4b5563;
      min-width: 18px;
      text-align: center;
      flex-shrink: 0;
    }
    .queue-item-row.is-now-playing .q-index {
      color: #10b981;
    }
    .queue-item-row .q-thumb {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
      background: #1a1a1f;
    }
    .queue-item-row .q-meta {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }
    .queue-item-row .q-title {
      font-size: 12.5px;
      font-weight: 500;
      color: #e5e7eb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s;
    }
    .queue-item-row:hover .q-title {
      color: #d1fae5;
    }
    .queue-item-row .q-artist {
      font-size: 11px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .queue-item-row .q-dur {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #4b5563;
      flex-shrink: 0;
      padding-left: 6px;
    }
    .queue-item-row.is-now-playing .q-dur {
      color: #10b981;
    }
    /* Live eq bars on now-playing row */
    .q-eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      flex-shrink: 0;
    }
    .q-eq-bars span {
      display: inline-block;
      width: 3px;
      background: #10b981;
      border-radius: 2px;
      animation: qeq 0.8s ease-in-out infinite alternate;
    }
    .q-eq-bars span:nth-child(2) { animation-delay: 0.15s; }
    .q-eq-bars span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes qeq {
      from { height: 3px; }
      to   { height: 14px; }
    }

    /* Queue empty state */
    .queue-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 10px;
      color: #374151;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-align: center;
    }
    .queue-empty-state svg {
      opacity: 0.3;
    }

    /* Queue loading shimmer */
    .queue-loading-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
    }
    .queue-shimmer {
      background: linear-gradient(90deg, #1a1a1f 25%, #232328 50%, #1a1a1f 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="selection:bg-emerald-500 selection:text-black">

  <!-- Persistent Root Audio Engine — NO loop attribute: queue auto-advance handles track cycling -->
  <audio id="void-core-audio" src="music.mp3" preload="auto"></audio>

  <!-- ==========================================
       MINIMALIST TOP HEADER
       ========================================== -->
  <header class="h-16 w-full px-6 md:px-12 border-b border-white/[0.06] bg-[#0b0b0f]/80 backdrop-blur-xl sticky top-0 z-40 flex items-center justify-between">
    <!-- Brand -->
    <div class="flex items-center gap-3">
      <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full shadow-[0_0_10px_#10b981]"></span>
      <a href="index.html" class="font-display font-bold text-lg tracking-wide text-white hover:text-emerald-400 transition-colors">
        VOID_BEATS
      </a>
      <span class="text-[10px] font-mono tracking-wider px-2 py-0.5 rounded bg-white/[0.05] text-neutral-400 border border-white/[0.06]">DECK</span>
    </div>

    <!-- Return Link -->
    <a href="index.html#features" class="px-4 py-1.5 rounded-full border border-white/[0.08] bg-white/[0.03] text-xs text-neutral-300 hover:text-white hover:bg-white/[0.08] hover:border-white/[0.15] transition-all flex items-center gap-2">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Return to Core</span>
    </a>
  </header>

  <!-- ==========================================
       MAIN AUDIO DECK
       ========================================== -->
  <main class="flex-1 max-w-[1080px] w-full mx-auto p-4 md:p-8 flex flex-col justify-center">
    
    <!-- Outer Deck Window: Subtle dark glass border & rounded-2xl -->
    <div class="relative bg-[#0b0b0f] border border-white/[0.08] rounded-2xl shadow-[0_30px_70px_rgba(0,0,0,0.85),0_0_40px_rgba(16,185,129,0.06)] overflow-hidden flex flex-col">
      
      <!-- Deck Top Bar -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-white/[0.06]">
        <div class="flex items-center gap-2.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>
          <span class="text-xs font-semibold text-white tracking-wide">High-Fidelity Audio Deck</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-xs font-mono text-neutral-400" id="deck-status-text">Playing</span>
        </div>
      </div>

      <!-- Two-Column Audio Deck Layout -->
      <div class="grid grid-cols-1 md:grid-cols-12 items-stretch min-h-[500px]">
        
        <!-- ==========================================
             LEFT PANEL: ALBUM ART & MINIMAL CONTROLS
             ========================================== -->
        <div class="md:col-span-6 lg:col-span-6 p-6 md:p-8 flex flex-col justify-between border-b md:border-b-0 md:border-r border-white/[0.06] bg-[#0b0b0f]">
          
          <!-- Square Album Artwork -->
          <div class="relative w-full max-w-[280px] aspect-square mx-auto mb-6 rounded-2xl overflow-hidden shadow-2xl border border-white/[0.08] bg-[#121216]">
            <img src="assets/album_art.jpg" alt="Album Artwork" id="album-cover-img" class="w-full h-full object-cover block">
            <div class="album-vinyl-glow"></div>
            <!-- Subtle live visualizer overlay at bottom of album art -->
            <canvas id="deck-visualizer-canvas" class="absolute bottom-0 left-0 w-full h-[65px] pointer-events-none opacity-70 z-10" width="400" height="70"></canvas>
          </div>

          <!-- Track Metadata -->
          <div class="mb-5 flex items-center justify-between gap-3 text-left">
            <div class="min-w-0 flex-1">
              <h2 class="text-2xl md:text-3xl font-bold text-white tracking-normal mb-1 truncate" id="current-track-title">CYBER_DRIFT_808</h2>
              <p class="text-sm text-neutral-400 font-normal truncate" id="current-track-artist">NEO_TOKYO_ARCHIVE</p>
            </div>
            <div class="flex items-center gap-1">
              <button id="void-like-btn" class="void-like-btn w-9 h-9 rounded-full flex items-center justify-center transition-all cursor-pointer text-neutral-500 hover:text-white hover:bg-white/5" title="Toggle Favorite (Like)">
                <svg id="void-like-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
              </button>
              <button id="void-add-to-pl-btn" class="void-add-to-pl-btn w-9 h-9 rounded-full flex items-center justify-center transition-all cursor-pointer text-neutral-500 hover:text-white hover:bg-white/5" title="Add to Playlist">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 5v14M5 12h14"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Sleek Thin Scrubber & Timers -->
          <div class="mb-5">
            <div class="flex items-center gap-3 font-mono text-xs text-neutral-500">
              <span id="current-time-display" class="min-w-[36px] text-neutral-400">00:00</span>
              <div id="progress-track-container" class="scrubber-track flex-1 h-1 bg-neutral-800 hover:h-1.5 rounded-full relative cursor-pointer transition-all">
                <div id="audio-progress-bar" class="h-full bg-emerald-500 rounded-full" style="width: 0%;"></div>
                <div id="scrubber-thumb" class="scrubber-thumb absolute top-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-white rounded-full shadow-[0_0_8px_rgba(16,185,129,0.8)] pointer-events-none opacity-0 transition-opacity" style="left: 0%;"></div>
              </div>
              <span id="total-duration-display" class="min-w-[36px] text-neutral-400 text-right">03:45</span>
            </div>
          </div>

          <!-- Minimal Transport Controls Cluster -->
          <div class="flex items-center justify-center gap-4 mb-4">
            <!-- Shuffle -->
            <button id="ctrl-shuffle" class="w-9 h-9 text-neutral-400 hover:text-white rounded-full flex items-center justify-center transition-colors cursor-pointer" title="Shuffle">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 3h5v5M4 20l17-17M21 16v5h-5M15 15l6 6M4 4l5 5"/>
              </svg>
            </button>

            <!-- Previous -->
            <button id="ctrl-prev" aria-label="Previous" class="w-10 h-10 text-neutral-300 hover:text-white rounded-full flex items-center justify-center hover:scale-110 active:scale-95 transition-all cursor-pointer" title="Previous Track">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
              </svg>
            </button>

            <!-- Play / Pause: Large circular white/emerald button -->
            <button id="play-pause-btn" class="w-14 h-14 bg-white text-black hover:bg-emerald-500 hover:text-black rounded-full flex items-center justify-center shadow-[0_4px_20px_rgba(255,255,255,0.2)] hover:shadow-[0_6px_24px_rgba(16,185,129,0.5)] hover:scale-105 active:scale-95 transition-all cursor-pointer" title="Play / Pause">
              <svg id="icon-play" class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5.14v14l11-7-11-7z"/>
              </svg>
              <svg id="icon-pause" class="w-6 h-6 hidden" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="5" width="4" height="14" rx="1"/>
                <rect x="14" y="5" width="4" height="14" rx="1"/>
              </svg>
            </button>

            <!-- Next -->
            <button id="ctrl-next" aria-label="Next" class="w-10 h-10 text-neutral-300 hover:text-white rounded-full flex items-center justify-center hover:scale-110 active:scale-95 transition-all cursor-pointer" title="Next Track">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
              </svg>
            </button>

            <!-- Loop -->
            <button id="ctrl-loop" class="w-9 h-9 text-neutral-400 hover:text-emerald-300 rounded-full flex items-center justify-center transition-colors cursor-pointer" title="Repeat: Off">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/>
              </svg>
            </button>
          </div>

          <!-- Bottom Volume Bar -->
          <div class="flex items-center justify-end gap-2 text-neutral-400 text-xs">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <input id="volume-slider" type="range" min="0" max="100" value="80" class="w-20 h-1 bg-neutral-800 rounded-full cursor-pointer accent-emerald-500">
            <span id="volume-label" class="w-7 text-right font-mono text-neutral-400">80%</span>
          </div>

        </div>

        <!-- ==========================================
             RIGHT PANEL: DUAL-TAB SEARCH / UP NEXT QUEUE
             ========================================== -->
        <div class="md:col-span-6 lg:col-span-6 p-6 md:p-7 bg-white/[0.015] flex flex-col justify-between">

          <div>
            <!-- ── DUAL TAB SWITCHER ── -->
            <div class="flex items-center gap-1.5 mb-4 border-b border-white/[0.06] pb-3">
              <button id="deck-tab-search" class="deck-tab active" title="Browse & search tracks">
                // SEARCH
              </button>
              <button id="deck-tab-queue" class="deck-tab flex items-center gap-2" title="Upcoming radio queue">
                <span>// UP NEXT</span>
                <span id="queue-counter" class="text-[10px] bg-emerald-500/10 text-emerald-500/70 px-1.5 py-0.5 rounded-full font-mono border border-emerald-500/20 min-w-[20px] text-center">0</span>
              </button>
              <button id="deck-tab-playlists" class="deck-tab flex items-center gap-2" title="Custom Playlists & Liked Tracks">
                <span>// PLAYLISTS</span>
              </button>
            </div>

            <!-- ── SEARCH VIEW WRAPPER ── -->
            <div id="search-view-container">
              <!-- Minimal Search Pill -->
              <div class="relative mb-3.5">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-500">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                </div>
                <input type="text"
                       id="search-input"
                       placeholder="Search tracks, artists, or enter query..."
                       class="w-full bg-neutral-900/80 border border-neutral-800 rounded-full pl-9 pr-4 py-2.5 text-sm text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-500 transition-colors"
                       autocomplete="off"
                       spellcheck="false">
              </div>

              <!-- Filter Pills -->
              <div class="flex flex-wrap gap-2 mb-4" id="filter-tabs">
                <button class="filter-tab active px-3.5 py-1 text-xs rounded-full bg-white text-black font-semibold cursor-pointer transition-colors" data-filter="all">All</button>
                <button class="filter-tab px-3.5 py-1 text-xs rounded-full bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white cursor-pointer transition-colors" data-filter="lofi">Lo-Fi</button>
                <button class="filter-tab px-3.5 py-1 text-xs rounded-full bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white cursor-pointer transition-colors" data-filter="synthwave">Synthwave</button>
                <button class="filter-tab px-3.5 py-1 text-xs rounded-full bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white cursor-pointer transition-colors" data-filter="ambient">Ambient</button>
              </div>

              <!-- Track Rows -->
              <div id="playlist-container" class="custom-scrollbar space-y-1 max-h-[350px] overflow-y-auto pr-1">
                <!-- Dynamically populated -->
              </div>
            </div>

            <!-- ── QUEUE VIEW WRAPPER (hidden by default) ── -->
            <div id="queue-view-container" style="display:none;">
              <div class="flex items-center justify-between mb-3 px-1">
                <span class="text-[11px] font-mono text-neutral-500 tracking-widest">TRANSMISSION QUEUE</span>
                <span class="text-[10px] font-mono text-emerald-500/60">// LAST.FM ENGINE</span>
              </div>
              <!-- Loading shimmer shown while queue is being fetched -->
              <div id="queue-loading" style="display:none;" class="space-y-2">
                <div class="queue-loading-row" aria-hidden="true">
                  <div class="queue-shimmer w-4 h-3 rounded"></div>
                  <div class="queue-shimmer w-9 h-9 rounded-lg"></div>
                  <div class="flex-1 space-y-1.5">
                    <div class="queue-shimmer h-2.5 w-4/5 rounded"></div>
                    <div class="queue-shimmer h-2 w-2/5 rounded"></div>
                  </div>
                </div>
                <div class="queue-loading-row" aria-hidden="true">
                  <div class="queue-shimmer w-4 h-3 rounded"></div>
                  <div class="queue-shimmer w-9 h-9 rounded-lg"></div>
                  <div class="flex-1 space-y-1.5">
                    <div class="queue-shimmer h-2.5 w-3/5 rounded"></div>
                    <div class="queue-shimmer h-2 w-1/3 rounded"></div>
                  </div>
                </div>
                <div class="queue-loading-row" aria-hidden="true">
                  <div class="queue-shimmer w-4 h-3 rounded"></div>
                  <div class="queue-shimmer w-9 h-9 rounded-lg"></div>
                  <div class="flex-1 space-y-1.5">
                    <div class="queue-shimmer h-2.5 w-4/6 rounded"></div>
                    <div class="queue-shimmer h-2 w-2/5 rounded"></div>
                  </div>
                </div>
              </div>
              <!-- Actual queue items list -->
              <div id="queue-items-list" class="custom-scrollbar space-y-1 overflow-y-auto max-h-[350px] pr-1">
                <!-- Injected by renderQueueView() -->
              </div>
            </div>

            <!-- ── PLAYLISTS VIEW WRAPPER (hidden by default) ── -->
            <div id="playlists-view-container" style="display:none;max-height:350px;overflow-y:auto;" class="custom-scrollbar pr-1">
              <!-- Injected by renderPlaylistsView() -->
            </div>
          </div>

          <!-- Panel Footer Status -->
          <div class="pt-3 mt-3 border-t border-white/[0.06] flex items-center justify-between text-xs text-neutral-500">
            <span id="track-library-count">3 Tracks</span>
            <span class="font-mono text-[11px] text-neutral-400 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              VOID_BEATS
            </span>
          </div>

        </div>

      </div>

    </div>
  </main>

  <!-- ==========================================
       MINIMAL FOOTER
       ========================================== -->
  <footer class="w-full py-4 text-center text-xs text-neutral-600 font-mono">
    <span>VOID // MODERN AUDIO DECK</span>
  </footer>

  <!-- ==========================================
       VOID_BEATS ENGINE v4 — Unified High-Res Audio Engine
       iTunes Open API HD Metadata + Direct Streaming
       ========================================== -->
  <script>
  (() => {
    'use strict';

    // ─────────────────────────────────────────────────────────────
    // STATE & REFS
    // ─────────────────────────────────────────────────────────────
    const FALLBACK_COVER = 'assets/images/album-art.png';
    window.playQueue = window.playQueue || [];
    window.currentTrackIndex = window.currentTrackIndex || 0;
    let isAutoplayActive = true;
    let currentIndex  = 0;
    let isLooping     = false;
    let isShuffle     = false;
    let activeFilter  = 'all';
    let isSearchMode  = false;
    let activeDeckTab = 'search'; // 'search' | 'queue'
    // Active deck tab state ('search' | 'queue' | 'playlists')

    // ─────────────────────────────────────────────────────────────
    // TAB SWITCHER LOGIC
    // ─────────────────────────────────────────────────────────────
    const tabSearch     = document.getElementById('deck-tab-search');
    const tabQueue      = document.getElementById('deck-tab-queue');
    const tabPlaylists  = document.getElementById('deck-tab-playlists');
    const searchView    = document.getElementById('search-view-container');
    const queueView     = document.getElementById('queue-view-container');
    const playlistsView = document.getElementById('playlists-view-container');
    const queueCounter  = document.getElementById('queue-counter');

    function switchTab(tab) {
      activeDeckTab = tab;

      if (tabSearch) {
        tabSearch.classList.toggle('active', tab === 'search');
        tabSearch.classList.toggle('active-queue', false);
      }
      if (tabQueue) {
        tabQueue.classList.toggle('active-queue', tab === 'queue');
        tabQueue.classList.toggle('active', false);
      }
      if (tabPlaylists) {
        tabPlaylists.classList.toggle('active-queue', tab === 'playlists');
        tabPlaylists.classList.toggle('active', false);
      }

      if (searchView)    searchView.style.display    = (tab === 'search') ? '' : 'none';
      if (queueView)     queueView.style.display     = (tab === 'queue') ? '' : 'none';
      if (playlistsView) playlistsView.style.display = (tab === 'playlists') ? '' : 'none';

      if (tab === 'queue') renderQueueView();
      if (tab === 'playlists') renderPlaylistsView();
    }

    if (tabSearch)    tabSearch.addEventListener('click', () => switchTab('search'));
    if (tabQueue)     tabQueue.addEventListener('click',  () => switchTab('queue'));
    if (tabPlaylists) tabPlaylists.addEventListener('click', () => switchTab('playlists'));

    // Update queue counter badge
    function updateQueueCounter() {
      const total = window.playQueue ? window.playQueue.length : 0;
      // Remaining after current
      const remaining = Math.max(0, total - (window.currentQueueIndex || 0) - 1);
      if (queueCounter) {
        queueCounter.textContent = remaining;
        queueCounter.classList.toggle('has-items', remaining > 0);
        queueCounter.style.color = remaining > 0 ? '#10b981' : '';
        queueCounter.style.background = remaining > 0 ? 'rgba(16,185,129,0.12)' : '';
        queueCounter.style.borderColor = remaining > 0 ? 'rgba(16,185,129,0.3)' : '';
      }
    }

    // ─────────────────────────────────────────────────────────────
    // ITUNES ARTWORK RESOLUTION & HYDRATION UTILITY
    // ─────────────────────────────────────────────────────────────
    const artworkCache = new Map();

    function isMissingOrPlaceholderCover(url) {
      if (!url) return true;
      const s = String(url).toLowerCase();
      return s.includes('album-art.png') || s.includes('album_art.jpg') || s.includes('2a96cbd8b46e442fc41c2b86b821562f') || s.includes('placeholder') || s.includes('default');
    }

    async function fetchTrackArtwork(title, artist) {
      const cleanTitle = (title || '').replace(/\(.*?\)|\[.*?\]/g, '').trim();
      const cleanArtist = (artist || '').replace(/\(.*?\)|\[.*?\]/g, '').trim();
      const cacheKey = `${cleanTitle.toLowerCase()}||${cleanArtist.toLowerCase()}`;

      if (artworkCache.has(cacheKey)) {
        return artworkCache.get(cacheKey);
      }

      try {
        const term = encodeURIComponent(`${cleanTitle} ${cleanArtist}`.trim());
        const res = await fetch(`https://itunes.apple.com/search?term=${term}&entity=song&limit=1`);
        if (!res.ok) throw new Error(`iTunes HTTP ${res.status}`);
        const data = await res.json();
        const raw = data.results?.[0]?.artworkUrl100;
        if (raw) {
          const hdUrl = raw.replace('100x100bb', '500x500bb');
          artworkCache.set(cacheKey, hdUrl);
          return hdUrl;
        }
      } catch (err) {
        console.warn('// ARTWORK HYDRATION ERROR:', err.message);
      }

      artworkCache.set(cacheKey, null);
      return null;
    }
    window.fetchTrackArtwork = fetchTrackArtwork;
    window.artworkCache = artworkCache;

    function hydrateQueueArtwork() {
      const queue = window.playQueue || [];
      queue.forEach((track, i) => {
        if (!track) return;
        const cleanKey = `${(track.title || '').replace(/\(.*?\)|\[.*?\]/g, '').trim().toLowerCase()}||${(track.artist || '').replace(/\(.*?\)|\[.*?\]/g, '').trim().toLowerCase()}`;
        if (!isMissingOrPlaceholderCover(track.cover)) {
          if (!artworkCache.has(cleanKey)) artworkCache.set(cleanKey, track.cover);
          return;
        }

        fetchTrackArtwork(track.title, track.artist).then(hdUrl => {
          if (!hdUrl) return;
          track.cover = hdUrl;

          // Patch live <img> in #queue-items-list without re-rendering the whole DOM
          const img = document.querySelector(
            `#queue-items-list [data-qi="${i}"] img, #queue-items-list .queue-item-row:nth-child(${i + 1}) img, [data-qi="${i}"] img`
          );
          if (img) {
            img.src = hdUrl;
          }

          // Active cover sync if this item is currently playing
          if (window.currentQueueIndex === i) {
            const coverEl = document.getElementById('album-cover-img') || mainCover;
            if (coverEl) coverEl.src = hdUrl;
          }
        });
      });
    }
    window.hydrateQueueArtwork = hydrateQueueArtwork;

    // ─────────────────────────────────────────────────────────────
    // HARDWARE & OS-LEVEL MEDIASESSION API
    // ─────────────────────────────────────────────────────────────
    function updateMediaSessionMetadata(track) {
      if (!('mediaSession' in navigator) || !track) return;
      try {
        const coverUrl = track.cover || 'assets/images/album-art.png';
        const absCover = new URL(coverUrl, window.location.href).href;

        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title || 'Unknown Track',
          artist: track.artist || 'VOID Audio',
          album: 'VOID Cyber-Deck',
          artwork: [
            { src: absCover, sizes: '96x96', type: 'image/jpeg' },
            { src: absCover, sizes: '256x256', type: 'image/jpeg' },
            { src: absCover, sizes: '512x512', type: 'image/jpeg' }
          ]
        });
      } catch (err) {
        console.warn('// MediaSession metadata update failed:', err);
      }
    }
    window.updateMediaSessionMetadata = updateMediaSessionMetadata;

    function updateMediaSessionPositionState() {
      if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
      try {
        if (player.duration && !isNaN(player.duration) && isFinite(player.duration) && player.duration > 0) {
          navigator.mediaSession.setPositionState({
            duration: player.duration,
            playbackRate: player.playbackRate || 1.0,
            position: Math.min(player.currentTime, player.duration)
          });
        }
      } catch (err) {}
    }
    window.updateMediaSessionPositionState = updateMediaSessionPositionState;

    function initMediaSessionHandlers() {
      if (!('mediaSession' in navigator)) return;

      const actionHandlers = {
        play: () => {
          player.play().catch(console.error);
        },
        pause: () => {
          player.pause();
        },
        previoustrack: () => {
          if (typeof playPreviousTrack === 'function') playPreviousTrack();
        },
        nexttrack: () => {
          if (typeof playNextTrack === 'function') playNextTrack();
        },
        seekto: (details) => {
          if (details.seekTime !== undefined && !isNaN(details.seekTime)) {
            player.currentTime = details.seekTime;
            updateMediaSessionPositionState();
          }
        }
      };

      for (const [action, handler] of Object.entries(actionHandlers)) {
        try {
          navigator.mediaSession.setActionHandler(action, handler);
        } catch (error) {
          console.warn(`MediaSession action "${action}" not supported.`, error);
        }
      }
    }
    window.initMediaSessionHandlers = initMediaSessionHandlers;

    // ─────────────────────────────────────────────────────────────
    // TRACK FAVORITING & LIKE ENGINE (LOCAL PERSISTENCE)
    // ─────────────────────────────────────────────────────────────
    function loadLikedTracks() {
      try {
        const raw = localStorage.getItem('void_liked_tracks');
        window.likedTracks = raw ? JSON.parse(raw) : [];
      } catch (e) {
        window.likedTracks = [];
      }
      return window.likedTracks;
    }
    window.loadLikedTracks = loadLikedTracks;

    function saveLikedTracks() {
      try {
        localStorage.setItem('void_liked_tracks', JSON.stringify(window.likedTracks || []));
      } catch (e) {}
    }

    function isTrackLiked(track) {
      if (!track || !window.likedTracks) return false;
      const tTitle = (track.title || '').toLowerCase().trim();
      const tArtist = (track.artist || '').toLowerCase().trim();
      return window.likedTracks.some(lt => {
        return (lt.title || '').toLowerCase().trim() === tTitle &&
               (lt.artist || '').toLowerCase().trim() === tArtist;
      });
    }
    window.isTrackLiked = isTrackLiked;

    function toggleLikeTrack(track) {
      if (!track) return false;
      loadLikedTracks();
      const tTitle = (track.title || '').toLowerCase().trim();
      const tArtist = (track.artist || '').toLowerCase().trim();
      const existingIdx = window.likedTracks.findIndex(lt => {
        return (lt.title || '').toLowerCase().trim() === tTitle &&
               (lt.artist || '').toLowerCase().trim() === tArtist;
      });

      let nowLiked = false;
      if (existingIdx >= 0) {
        window.likedTracks.splice(existingIdx, 1);
        nowLiked = false;
      } else {
        window.likedTracks.unshift({
          id: track.id || `liked_${Date.now()}`,
          title: track.title,
          artist: track.artist,
          cover: track.cover || 'assets/images/album-art.png',
          duration: track.duration || '03:30',
          previewUrl: track.previewUrl || track.src || '',
          likedAt: Date.now()
        });
        nowLiked = true;
      }
      saveLikedTracks();
      updateLikeUI(track);
      if (typeof renderPlaylistsView === 'function') renderPlaylistsView();
      return nowLiked;
    }
    window.toggleLikeTrack = toggleLikeTrack;

    function updateLikeUI(track) {
      const targetTrack = track || window.currentActiveTrack;
      const isLiked = isTrackLiked(targetTrack);
      const likeBtn = document.getElementById('void-like-btn');
      const likeIcon = document.getElementById('void-like-icon');
      if (!likeBtn || !likeIcon) return;

      if (isLiked) {
        likeBtn.classList.add('liked');
        likeBtn.style.color = '#10b981';
        likeIcon.setAttribute('fill', '#10b981');
        likeIcon.style.filter = 'drop-shadow(0 0 6px rgba(16, 185, 129, 0.7))';
      } else {
        likeBtn.classList.remove('liked');
        likeBtn.style.color = '#6b7280';
        likeIcon.setAttribute('fill', 'none');
        likeIcon.style.filter = 'none';
      }
    }
    window.updateLikeUI = updateLikeUI;

    // ─────────────────────────────────────────────────────────────
    // LISTENING HISTORY STORE (void_listening_history)
    // Records strictly on confirmed playback starts
    // ─────────────────────────────────────────────────────────────
    const LISTENING_HISTORY_KEY = 'void_listening_history';
    const LISTENING_HISTORY_LIMIT = 50;

    function trackIdentity(track) {
      if (!track) return '';
      return `${(track.title || '').trim().toLowerCase()}::${(track.artist || '').trim().toLowerCase()}`;
    }

    function loadListeningHistory() {
      try {
        const raw = localStorage.getItem(LISTENING_HISTORY_KEY);
        const history = raw ? JSON.parse(raw) : [];
        return Array.isArray(history) ? history : [];
      } catch (_) {
        return [];
      }
    }
    window.loadListeningHistory = loadListeningHistory;

    function getRecentlyPlayed(limit = 8) {
      return loadListeningHistory().slice(0, limit);
    }
    window.getRecentlyPlayed = getRecentlyPlayed;

    function getHomeSeedsFromHistory(max = 3) {
      const history = loadListeningHistory();
      const seeds = [];
      const seenArtists = new Set();
      for (const item of history) {
        const normArt = (item.artist || '').trim().toLowerCase();
        if (!seenArtists.has(normArt)) {
          seenArtists.add(normArt);
          seeds.push(item);
          if (seeds.length >= max) break;
        }
      }
      return seeds;
    }
    window.getHomeSeedsFromHistory = getHomeSeedsFromHistory;

    function getTopArtistsFromHistory(limit = 5) {
      const history = loadListeningHistory();
      const freqs = {};
      for (const item of history) {
        const art = (item.artist || '').trim();
        if (art && art.toLowerCase() !== 'unknown artist') {
          freqs[art] = (freqs[art] || 0) + (item.playCount || 1);
        }
      }
      return Object.entries(freqs)
        .sort((a, b) => b[1] - a[1])
        .slice(0, limit)
        .map(([art]) => art);
    }
    window.getTopArtistsFromHistory = getTopArtistsFromHistory;

    function recordListeningStart(track) {
      if (!track || !track.title) return;
      const now = Date.now();
      const key = trackIdentity(track);
      const history = loadListeningHistory();
      const existing = history.find(item => trackIdentity(item) === key);
      if (existing) {
        existing.lastPlayedAt = now;
        existing.playCount = (existing.playCount || 0) + 1;
        existing.cover = track.cover || existing.cover || FALLBACK_COVER;
        existing.duration = track.duration || existing.duration || '03:30';
        existing.previewUrl = track.previewUrl || existing.previewUrl || '';
      } else {
        history.push({
          id: String(track.id || key),
          title: track.title,
          artist: track.artist || 'Unknown Artist',
          cover: track.cover || FALLBACK_COVER,
          duration: track.duration || '03:30',
          previewUrl: track.previewUrl || '',
          firstPlayedAt: now,
          lastPlayedAt: now,
          playCount: 1
        });
      }
      history.sort((a, b) => (b.lastPlayedAt || 0) - (a.lastPlayedAt || 0));
      try {
        localStorage.setItem(LISTENING_HISTORY_KEY, JSON.stringify(history.slice(0, LISTENING_HISTORY_LIMIT)));
      } catch (_) {}
    }
    window.recordListeningStart = recordListeningStart;

    // ─────────────────────────────────────────────────────────────
    // CUSTOM PLAYLIST ENGINE (LOCAL PERSISTENCE)
    // ─────────────────────────────────────────────────────────────
    function esc(s) {
      return (s || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function loadCustomPlaylists() {
      try {
        const raw = localStorage.getItem('void_custom_playlists');
        if (raw) {
          window.customPlaylists = JSON.parse(raw);
        } else {
          window.customPlaylists = [
            { id: 'pl_1', name: 'NEURAL_DRIFT', tracks: [] }
          ];
          saveCustomPlaylists();
        }
      } catch (e) {
        window.customPlaylists = [{ id: 'pl_1', name: 'NEURAL_DRIFT', tracks: [] }];
      }
      return window.customPlaylists;
    }
    window.loadCustomPlaylists = loadCustomPlaylists;

    function saveCustomPlaylists() {
      try {
        localStorage.setItem('void_custom_playlists', JSON.stringify(window.customPlaylists || []));
      } catch (e) {}
    }

    function createPlaylist(name) {
      if (!name || !name.trim()) return null;
      loadCustomPlaylists();
      const newPl = {
        id: 'pl_' + Date.now(),
        name: name.trim().toUpperCase(),
        tracks: []
      };
      window.customPlaylists.push(newPl);
      saveCustomPlaylists();
      renderPlaylistsView();
      return newPl;
    }
    window.createPlaylist = createPlaylist;

    function addTrackToPlaylist(playlistId, track) {
      if (!track) return false;
      loadCustomPlaylists();
      const pl = window.customPlaylists.find(p => p.id === playlistId);
      if (!pl) return false;

      const exists = pl.tracks.some(t =>
        (t.title || '').toLowerCase().trim() === (track.title || '').toLowerCase().trim() &&
        (t.artist || '').toLowerCase().trim() === (track.artist || '').toLowerCase().trim()
      );
      if (!exists) {
        pl.tracks.push({
          id: track.id || `track_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`,
          title: track.title,
          artist: track.artist,
          duration: track.duration || '03:30',
          cover: track.cover || 'assets/images/album-art.png',
          previewUrl: track.previewUrl || track.src || '',
          channel: track.channel || 'all',
          addedAt: Date.now()
        });
        saveCustomPlaylists();
        if (typeof renderPlaylistsView === 'function') renderPlaylistsView();
        return true;
      }
      return false;
    }
    window.addTrackToPlaylist = addTrackToPlaylist;

    // ─── PLAYLIST PICKER MODAL ──────────────────────────────────
    function openPlaylistPicker(track) {
      const targetTrack = track || window.currentActiveTrack || (window.playQueue && window.playQueue[window.currentQueueIndex]);
      if (!targetTrack) {
        alert('No track selected to add.');
        return;
      }

      loadCustomPlaylists();

      let modal = document.getElementById('void-pl-picker-modal');
      if (modal) modal.remove();

      modal = document.createElement('div');
      modal.id = 'void-pl-picker-modal';
      modal.style.cssText = `
        position: fixed; inset: 0; z-index: 999999;
        background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(12px);
        display: flex; align-items: center; justify-content: center;
        padding: 16px; opacity: 0; transition: opacity .2s ease;
      `;

      const renderModalContent = () => {
        const playlists = window.customPlaylists || [];
        const coverArt = targetTrack.cover || 'assets/images/album-art.png';

        modal.innerHTML = `
          <div style="background: #0d0f14; border: 1px solid rgba(16,185,129,0.3); border-radius: 14px; width: 100%; max-width: 420px; box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 30px rgba(16,185,129,0.15); overflow: hidden; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; display: flex; flex-direction: column;">
            <!-- Header -->
            <div style="padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.02);">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="color: #10b981; font-weight: 700; font-size: 11px; letter-spacing: 0.08em;">// ADD TO PLAYLIST</span>
              </div>
              <button id="void-pl-modal-close" style="background: transparent; border: none; color: #9ca3af; font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 6px; border-radius: 4px;">×</button>
            </div>

            <!-- Target Track Mini Preview -->
            <div style="padding: 12px 16px; background: rgba(16,185,129,0.05); border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 12px;">
              <img src="${coverArt}" onerror="this.src='assets/images/album-art.png'" style="width: 42px; height: 42px; border-radius: 8px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0;">
              <div style="min-width: 0; flex: 1;">
                <div style="color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${esc(targetTrack.title)}</div>
                <div style="color: #9ca3af; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${esc(targetTrack.artist)}</div>
              </div>
            </div>

            <!-- Create New Playlist -->
            <div style="padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; gap: 8px;">
              <input type="text" id="void-pl-new-name-input" placeholder="NEW PLAYLIST NAME..."
                     style="flex: 1; min-width: 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 7px; padding: 7px 10px; color: #fff; font-size: 11px; font-family: monospace; outline: none;">
              <button id="void-pl-create-btn"
                      style="background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); color: #10b981; font-weight: 700; font-size: 10px; font-family: monospace; padding: 7px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; transition: all .15s;">
                + CREATE
              </button>
            </div>

            <!-- Playlists List -->
            <div style="padding: 10px 16px; max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;">
              <div style="font-size: 9px; color: #6b7280; letter-spacing: 0.08em; margin-bottom: 2px;">// SELECT DESTINATION</div>
              ${playlists.length === 0 ? '<div style="color: #6b7280; font-size: 11px; text-align: center; padding: 16px;">// NO PLAYLISTS CREATED YET</div>' : ''}
              ${playlists.map(pl => {
                const alreadyIn = pl.tracks.some(t =>
                  (t.title || '').toLowerCase().trim() === (targetTrack.title || '').toLowerCase().trim() &&
                  (t.artist || '').toLowerCase().trim() === (targetTrack.artist || '').toLowerCase().trim()
                );
                return `
                  <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; gap: 10px;">
                    <div style="min-width: 0; flex: 1;">
                      <div style="font-size: 12px; font-weight: 600; color: #e5e7eb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">// ${esc(pl.name)}</div>
                      <div style="font-size: 10px; color: #6b7280;">${pl.tracks.length} ${pl.tracks.length === 1 ? 'track' : 'tracks'}</div>
                    </div>
                    <button class="void-btn-modal-add" data-plid="${pl.id}"
                            style="background: ${alreadyIn ? 'rgba(16,185,129,0.1)' : 'rgba(255,255,255,0.08)'};
                                   border: 1px solid ${alreadyIn ? 'rgba(16,185,129,0.4)' : 'rgba(255,255,255,0.15)'};
                                   color: ${alreadyIn ? '#10b981' : '#e5e7eb'};
                                   font-size: 10px; font-family: monospace; font-weight: 600; padding: 5px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; transition: all .15s;">
                      ${alreadyIn ? '✓ IN PLAYLIST' : '+ ADD'}
                    </button>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Modal Footer: Quick Switch to // PLAYLISTS -->
            <div style="padding: 10px 16px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3);">
              <button id="void-pl-modal-view-tab" style="background: transparent; border: none; color: #10b981; font-size: 10px; font-family: monospace; cursor: pointer; padding: 4px 0; text-decoration: underline;">
                → VIEW ALL IN // PLAYLISTS TAB
              </button>
              <span style="font-size: 9px; color: #4b5563;">VOID_STORAGE</span>
            </div>
          </div>
        `;

        // Wire modal events
        modal.querySelector('#void-pl-modal-close')?.addEventListener('click', () => closeModal());

        const createBtn = modal.querySelector('#void-pl-create-btn');
        const nameInput = modal.querySelector('#void-pl-new-name-input');
        const handleCreate = () => {
          const val = nameInput?.value?.trim();

    function formatTime(sec) {
      if (!sec || isNaN(sec) || sec < 0) return '00:00';
      const s = Math.floor(sec);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}:${r < 10 ? '0' : ''}${r}`;
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')

    // ─────────────────────────────────────────────────────────────
    // 1. UNIFIED LAST.FM FETCHER (WITH VERCEL ROUTE + DIRECT FALLBACK)
    // ─────────────────────────────────────────────────────────────
    // Dynamic Taste Weighting: Inject seed tracks from user's liked pool into discovery cascade
    async function applyTasteWeighting(tracks) {
      if (!tracks || tracks.length === 0) return tracks;
      loadLikedTracks();
      if (!window.likedTracks || window.likedTracks.length === 0) return tracks;

      const likedArtists = [...new Set(
        window.likedTracks
          .map(t => t.artist)
          .filter(a => a)
      )];

      if (likedArtists.length === 0) return tracks;

      const result = [...tracks];
      const sampleArtists = likedArtists.slice(0, 2);
      const LFM_KEY = "77db9b1ef3618ce60cff5c372123ee61";
      for (const likedArt of sampleArtists) {
        try {
          const topUrl = `https://ws.audioscrobbler.com/2.0/?method=artist.gettoptracks&artist=${encodeURIComponent(likedArt)}&api_key=${LFM_KEY}&format=json&limit=2`;
          const res = await fetch(topUrl);
          if (res.ok) {
            const d = await res.json();
            const items = d.toptracks?.track || [];
            if (items.length > 0) {
              const picked = items[0];
              const injected = {
                title: picked.name,
                artist: likedArt,
                duration: '03:30',
                cover: FALLBACK_COVER
              };
              console.log(`// TASTE ENGINE: Injected "${injected.title}" by liked artist "${likedArt}"`);
              const insertIdx = Math.min(2, result.length);
              result.splice(insertIdx, 0, injected);
            }
          }
        } catch (_) {}
      }
      return result;
    }

    async function fetchSimilarTracksRadio(trackTitle, artistName) {
      const rawTitle = typeof trackTitle === 'object' ? (trackTitle?.title || '') : (trackTitle || '');
      const rawArtist = typeof trackTitle === 'object' ? (trackTitle?.artist || '') : (artistName || '');
      console.log(`// RADIO: Generating station for "${rawTitle}" by "${rawArtist}"`);
      
      // Clean titles (remove versions like '(Piano Solo)', '(Minecraft)', '(Remix)')
      const cleanTitle = rawTitle.replace(/\(.*?\)|\[.*?\]/g, '').trim();
      const cleanArtist = rawArtist.replace(/\(.*?\)|\[.*?\]/g, '').trim();

      // Route 1: Try internal serverless endpoint
      try {
        const res = await fetch(`/api/recommend?track=${encodeURIComponent(cleanTitle)}&artist=${encodeURIComponent(cleanArtist)}`);
        if (res.ok) {
          const data = await res.json();
          if (data.success && data.tracks && data.tracks.length > 0) {
            console.log(`// RADIO: Fetched ${data.tracks.length} similar tracks via server proxy`);
            const mapped = data.tracks.map(t => ({
              ...t,
              cover: t.cover || FALLBACK_COVER
            }));
            return await applyTasteWeighting(mapped);
          }
        }
      } catch (e) {
        console.warn("// Server proxy unavailable, trying client fallback...");
      }

      // Route 2: Direct public Last.fm read-only fallback (if server route gives 404 on localhost)
      try {
        const apiKey = "77db9b1ef3618ce60cff5c372123ee61";
        if (apiKey && !apiKey.includes("PASTE_")) {
          const url = `https://ws.audioscrobbler.com/2.0/?method=track.getsimilar&artist=${encodeURIComponent(cleanArtist)}&track=${encodeURIComponent(cleanTitle)}&api_key=${apiKey}&format=json&limit=10`;
          const res = await fetch(url);
          const data = await res.json();
          const list = data.similartracks?.track || [];
          const mapped = list.map(item => ({
            title: item.name,
            artist: item.artist?.name || "Unknown Artist",
            duration: "03:30",
            cover: FALLBACK_COVER
          }));
          return await applyTasteWeighting(mapped);
        }
      } catch (err) {
        console.error("// RADIO: Fallback also failed", err);
      }

      return [];
    }
    window.fetchSimilarTracksRadio = fetchSimilarTracksRadio;

    // ─── UNIVERSAL QUEUE DEDUPLICATION FILTER ────────────────────
    function deduplicateTracksAgainstQueue(freshTracks) {
      if (!freshTracks || !Array.isArray(freshTracks)) return [];
      const queue = window.playQueue || [];

      const normKey = (title, artist) => {
        const cleanT = (title || '').toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
        const cleanA = (artist || '').toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
        return `${cleanT}::${cleanA}`;
      };

      const existingKeys = new Set(
        queue.map(t => normKey(t.title, t.artist))
      );

      const seenInBatch = new Set();
      const uniqueNewTracks = freshTracks.filter(t => {
        if (!t || !t.title) return false;
        const key = normKey(t.title, t.artist);
        if (existingKeys.has(key) || seenInBatch.has(key)) {
          return false;
        }
        seenInBatch.add(key);
        return true;
      });

      return uniqueNewTracks;
    }
    window.deduplicateTracksAgainstQueue = deduplicateTracksAgainstQueue;

    // ─────────────────────────────────────────────────────────────
    // 2. CANONICAL QUEUE OPERATIONS & RADIO CONTROLLER
    // ─────────────────────────────────────────────────────────────
    window.playQueue = window.playQueue || [];
    window.currentQueueIndex = typeof window.currentQueueIndex === 'number' ? window.currentQueueIndex : 0;
    window.currentTrackIndex = typeof window.currentTrackIndex === 'number' ? window.currentTrackIndex : 0;
    let queueBuildToken = 0;
    let isExtendingQueue = false;

    function findTrackInActiveQueue(track) {
      if (!track || !window.playQueue) return -1;
      const targetId = track.id ? String(track.id) : null;
      const targetTitle = (track.title || '').trim().toLowerCase();
      const targetArtist = (track.artist || '').trim().toLowerCase();
      return window.playQueue.findIndex(candidate => {
        if (!candidate) return false;
        if (targetId && candidate.id && String(candidate.id) === targetId) return true;
        const cTitle = (candidate.title || '').trim().toLowerCase();
        const cArtist = (candidate.artist || '').trim().toLowerCase();
        return Boolean(targetTitle && cTitle && targetTitle === cTitle && targetArtist === cArtist);
      });
    }
    window.findTrackInActiveQueue = findTrackInActiveQueue;

    // Operation 1: PLAY_EXISTING_QUEUE_ITEM(index)
    // Preserves exact queue, updates queue cursor, starts track without fetching recommendations
    function playExistingQueueItem(index) {
      if (!window.playQueue || index < 0 || index >= window.playQueue.length) return false;
      const track = window.playQueue[index];
      window.currentQueueIndex = index;
      window.currentTrackIndex = index;
      playSelectedTrack(track);
      if (typeof renderQueueView === 'function') renderQueueView();
      if (typeof updateQueueCounter === 'function') updateQueueCounter();
      return true;
    }
    window.playExistingQueueItem = playExistingQueueItem;

    // Operation 2: ADD_TO_QUEUE(track)
    // Appends to existing queue without replacing or fetching recommendations
    function addTrackToQueue(track) {
      if (!track) return false;
      window.playQueue = window.playQueue || [];
      if (findTrackInActiveQueue(track) >= 0) return false;
      window.playQueue.push(track);
      if (typeof renderQueueView === 'function') renderQueueView();
      if (typeof updateQueueCounter === 'function') updateQueueCounter();
      if (typeof hydrateQueueArtwork === 'function') hydrateQueueArtwork();
      return true;
    }
    window.addTrackToQueue = addTrackToQueue;

    // Operation 3: PLAY_NEW_SESSION(track) / playTrackAndStartRadio
    // Creates a new queue/session for seedTrack and fetches recommendations asynchronously
    async function playTrackAndStartRadio(seedTrack) {
      if (!seedTrack) return;
      const existingIdx = findTrackInActiveQueue(seedTrack);
      if (existingIdx >= 0) {
        return playExistingQueueItem(existingIdx);
      }

      // New radio session
      window.playQueue = [seedTrack];
      window.currentQueueIndex = 0;
      window.currentTrackIndex = 0;
      const myToken = ++queueBuildToken;

      playSelectedTrack(seedTrack);

      if (typeof showQueueLoading === 'function') showQueueLoading();
      if (typeof updateQueueCounter === 'function') updateQueueCounter();

      try {
        const recommendations = await fetchSimilarTracksRadio(seedTrack.title, seedTrack.artist);
        if (myToken !== queueBuildToken) return;
        const uniqueRecs = deduplicateTracksAgainstQueue(recommendations);
        if (uniqueRecs.length > 0) {
          window.playQueue = [seedTrack, ...uniqueRecs];
          console.log(`// RADIO STATION ACTIVE: ${uniqueRecs.length} tracks queued.`);
        } else {
          console.log("// RADIO: No similar tracks found.");
        }
      } catch (err) {
        console.warn('// RADIO: recommendation fetch failed', err);
      } finally {
        if (myToken !== queueBuildToken) return;
        if (typeof renderQueueView === 'function') renderQueueView();
        if (typeof updateQueueCounter === 'function') updateQueueCounter();
        hydrateQueueArtwork();
      }

      if (window.playQueue.length > 1 && typeof switchTab === 'function') {
        if (activeDeckTab === 'search') switchTab('queue');
      }
    }
    window.playTrackAndStartRadio = playTrackAndStartRadio;

    // Operation 4: EXTEND_QUEUE(seedTrack)
    // Appends to END of existing queue when near exhaustion
    async function extendQueue(seedTrack) {
      if (!seedTrack || isExtendingQueue) return;
      isExtendingQueue = true;
      try {
        const recommendations = await fetchSimilarTracksRadio(seedTrack.title, seedTrack.artist);
        const uniqueRecs = deduplicateTracksAgainstQueue(recommendations);
        if (uniqueRecs.length > 0) {
          window.playQueue.push(...uniqueRecs);
          if (typeof renderQueueView === 'function') renderQueueView();
          if (typeof updateQueueCounter === 'function') updateQueueCounter();
          hydrateQueueArtwork();
        }
      } catch (err) {
        console.warn('// RADIO: extend queue failed', err);
      } finally {
        isExtendingQueue = false;
      }
    }
    window.extendQueue = extendQueue;

    async function ensureUpcomingQueueTracks(track) {
      if (!window.playQueue || !track) return;
      const curIdx = typeof window.currentQueueIndex === 'number' ? window.currentQueueIndex : 0;
      if (curIdx + 1 >= window.playQueue.length) {
        await extendQueue(track);
      }
    }
    window.ensureUpcomingQueueTracks = ensureUpcomingQueueTracks;

    // ─────────────────────────────────────────────────────────────
    // SEARCH PIPELINE (iTunes Open API — DISPLAY ONLY, NEVER OVERWRITES QUEUE)
    // ─────────────────────────────────────────────────────────────
    async function executeGlobalSearch(query) {
      if (!playlistBox) return;
      isSearchMode = true;

      playlistBox.innerHTML = `
        <div class="text-xs text-neutral-400 p-6 text-center animate-pulse font-mono">
          // TUNING FREQUENCIES FOR "${esc(query)}"...
        </div>`;

      try {
        const itunesUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=12`;
        const res = await fetch(itunesUrl);
        if (!res.ok) throw new Error(`iTunes HTTP ${res.status}`);
        const data = await res.json();
        const items = data.results || [];

        if (items.length === 0) {
          playlistBox.innerHTML = `<div class="text-xs text-neutral-500 p-6 text-center font-mono">// NO FREQUENCIES DETECTED.</div>`;
          if (trackCountEl) trackCountEl.textContent = '0 Tracks';
          return;
        }

        const tracks = items.map(item => {
          const rawArt = item.artworkUrl100 || '';
          const hdArt = rawArt ? rawArt.replace('100x100bb', '600x600bb') : FALLBACK_COVER;
          return {
            id: String(item.trackId || Math.random().toString(36).substring(2)),
            title: item.trackName || "Unknown Track",
            artist: item.artistName || "Unknown Artist",
            duration: formatTime((item.trackTimeMillis || 0) / 1000),
            cover: hdArt,
            previewUrl: item.previewUrl || ''
          };
        });

        // Search results are display-only — DO NOT mutate window.playQueue
        window.searchResultsTracks = tracks;
        currentIndex = 0;
        renderTracksList(tracks);
      } catch (err) {
        console.error("iTunes search failed:", err);
        playlistBox.innerHTML = `<div class="text-xs text-red-400 p-6 text-center font-mono">// SEARCH RELAY OFFLINE. RETRY.</div>`;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // RENDER SEARCH RESULT TRACKS
    // ─────────────────────────────────────────────────────────────
    function renderTracksList(tracks) {
      if (!playlistBox) return;
      playlistBox.innerHTML = '';

      if (trackCountEl) {
        trackCountEl.textContent = `${tracks.length} ${tracks.length === 1 ? 'Track' : 'Tracks'}`;

      tracks.forEach((track, idx) => {

        }`;

                <span class="active-track-dot w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>
              </div>` : ''}
            </div>

            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0 pl-2">
            <span class="text-xs font-mono ${isActive ? 'text-emerald-400' : 'text-neutral-500'}">${esc(track.duration)}</span>
            <button class="void-row-add-pl" title="Add to Playlist"
                    style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#9ca3af;width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;line-height:1;transition:all .15s;">
