<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GLOBAL PRESENCE — A real-time visualization of active connections.">
  <title>PRESENCE — VOID Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --surface: #f5f5f5;
      --surface-dark: #111111;
      --border: #e0e0e0;
      --text-primary: #000000;
      --text-muted: #666666;
      --text-dim: #999999;
      --neon-green: #00dd55;
      --neon-glow: rgba(0, 221, 85, 0.4);
      --font-display: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-primary);
      overflow: hidden;
    }

    /* ---- NAV ---- */
    #top-bar {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 28px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    #top-bar a {
      font-family: var(--font-display);
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    #top-bar a:hover { color: var(--neon-green); }

    .topbar-brand {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 5px;
      color: var(--text-primary);
      margin-right: auto;
    }
    .topbar-brand span { color: var(--neon-green); text-shadow: 0 0 12px var(--neon-glow); }

    #signal-status {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #signal-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-glow);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 8px var(--neon-glow); }
      50% { box-shadow: 0 0 20px var(--neon-glow), 0 0 40px rgba(0,221,85,0.2); }
    }

    /* ---- LAYOUT ---- */
    #layout {
      display: flex;
      height: 100vh;
      padding-top: 49px;
    }

    /* ---- MAP ---- */
    #map-wrap {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #050505;
    }

    #map-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 221, 85, 0.03);
      border: 1px solid var(--neon-green);
      box-shadow: inset 0 0 50px rgba(0, 221, 85, 0.1);
      pointer-events: none;
      z-index: 1000;
    }

    .leaflet-container {
      background: #050505;
      font-family: var(--font-mono);
    }

    /* Presence Ping Animation */
    .presence-ping {
      position: absolute;
      border-radius: 50%;
      border: 2px solid var(--neon-green);
      animation: pingAnim 3s cubic-bezier(0, 0, 0.2, 1) forwards;
      pointer-events: none;
      z-index: 500;
      transform: translate(-50%, -50%);
    }
    
    .presence-dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--neon-green);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
      z-index: 501;
      animation: dotFade 3s forwards;
    }

    @keyframes pingAnim {
      0% { width: 0; height: 0; opacity: 1; }
      100% { width: 120px; height: 120px; opacity: 0; }
    }
    
    @keyframes dotFade {
      0% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ---- SIDE PANEL ---- */
    #panel {
      width: 360px;
      min-width: 300px;
      background: #fff;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #panel-header {
      padding: 30px 24px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: #fafafa;
    }

    .panel-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--neon-green);
      margin-bottom: 12px;
      font-weight: bold;
    }

    #message-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-primary);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    #message-title span {
      display: block;
      color: var(--neon-green);
      text-shadow: 0 0 12px var(--neon-glow);
    }

    #location-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-top: 10px;
      line-height: 1.5;
    }

    /* ---- STREAM LIST ---- */
    #stream-list-wrap {
      flex: 1;
      overflow: auto;
      padding: 0;
      background: #000;
      color: #fff;
    }

    .list-header {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 3px;
      color: #666;
      padding: 16px 24px 10px;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(5px);
      z-index: 10;
    }

    #event-list {
      display: flex;
      flex-direction: column;
    }

    .event-item {
      padding: 14px 24px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: slideIn 0.3s ease-out forwards;
      opacity: 0;
      transform: translateX(-10px);
    }

    @keyframes slideIn {
      to { opacity: 1; transform: translateX(0); }
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .event-user {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--neon-green);
    }

    .event-time {
      font-family: var(--font-mono);
      font-size: 9px;
      color: #666;
    }

    .event-loc {
      font-family: var(--font-mono);
      font-size: 10px;
      color: #ccc;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .loc-dot {
      width: 4px; height: 4px;
      background: var(--neon-green);
      border-radius: 50%;
      box-shadow: 0 0 5px var(--neon-green);
    }

    /* Scrollbar */
    #stream-list-wrap::-webkit-scrollbar { width: 5px; }
    #stream-list-wrap::-webkit-scrollbar-track { background: #000; }
    #stream-list-wrap::-webkit-scrollbar-thumb { background: #333; border-radius: 0; }
    #stream-list-wrap::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }

    @media (max-width: 700px) {
      #layout { flex-direction: column; }
      #panel { width: 100%; min-width: unset; height: 50vh; border-left: none; border-top: 1px solid var(--border); }
      #map-wrap { height: 50vh; }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div id="top-bar">
    <span class="topbar-brand">PRESENCE<span>.</span>SYS</span>
    <a href="index.html">← RETURN</a>
    <div id="signal-status">
      <div id="signal-dot"></div>
      <span id="signal-label">MONITORING</span>
    </div>
  </div>

  <div id="layout">

    <!-- MAP -->
    <div id="map-wrap">
      <div id="map"></div>
    </div>

    <!-- SIDE PANEL -->
    <div id="panel">
      <div id="panel-header">
        <div class="panel-tag">● GLOBAL NETWORK</div>
        <div id="message-title">
          YOU ARE NOT
          <span>ALONE</span>
        </div>
        <div id="location-sub">
          Detecting real-time anomalies and user connections across the global grid. The void is watching.
        </div>
      </div>

      <!-- EVENT STREAM -->
      <div id="stream-list-wrap">
        <div class="list-header">LIVE CONNECTION LOG —</div>
        <div id="event-list">
          <!-- Events injected via JS -->
        </div>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (() => {
    'use strict';

    // Map Init
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2.5,
      zoomControl: false,
      attributionControl: false,
      keyboard: false,
      scrollWheelZoom: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
      maxZoom: 8,
      attribution: ''
    }).addTo(map);

    // Some base cities
    const CITIES = [
      { n: "Tokyo, JP", lat: 35.6762, lng: 139.6503, t: "Asia/Tokyo" },
      { n: "New York, US", lat: 40.7128, lng: -74.0060, t: "America/New_York" },
      { n: "London, UK", lat: 51.5074, lng: -0.1278, t: "Europe/London" },
      { n: "Paris, FR", lat: 48.8566, lng: 2.3522, t: "Europe/Paris" },
      { n: "Berlin, DE", lat: 52.5200, lng: 13.4050, t: "Europe/Berlin" },
      { n: "Moscow, RU", lat: 55.7558, lng: 37.6173, t: "Europe/Moscow" },
      { n: "Beijing, CN", lat: 39.9042, lng: 116.4074, t: "Asia/Shanghai" },
      { n: "Sydney, AU", lat: -33.8688, lng: 151.2093, t: "Australia/Sydney" },
      { n: "São Paulo, BR", lat: -23.5505, lng: -46.6333, t: "America/Sao_Paulo" },
      { n: "Mumbai, IN", lat: 19.0760, lng: 72.8777, t: "Asia/Kolkata" },
      { n: "Delhi, IN", lat: 28.7041, lng: 77.1025, t: "Asia/Kolkata" },
      { n: "Karachi, PK", lat: 24.8607, lng: 67.0011, t: "Asia/Karachi" },
      { n: "Seoul, KR", lat: 37.5665, lng: 126.9780, t: "Asia/Seoul" },
      { n: "Jakarta, ID", lat: -6.2088, lng: 106.8456, t: "Asia/Jakarta" },
      { n: "Cairo, EG", lat: 30.0444, lng: 31.2357, t: "Africa/Cairo" },
      { n: "Lagos, NG", lat: 6.5244, lng: 3.3792, t: "Africa/Lagos" },
      { n: "Toronto, CA", lat: 43.6510, lng: -79.3470, t: "America/Toronto" },
      { n: "Los Angeles, US", lat: 34.0522, lng: -118.2437, t: "America/Los_Angeles" },
      { n: "Dubai, AE", lat: 25.2048, lng: 55.2708, t: "Asia/Dubai" },
      { n: "Singapore, SG", lat: 1.3521, lng: 103.8198, t: "Asia/Singapore" },
      { n: "Mexico City, MX", lat: 19.4326, lng: -99.1332, t: "America/Mexico_City" },
      { n: "Istanbul, TR", lat: 41.0082, lng: 28.9784, t: "Europe/Istanbul" },
      { n: "Bangkok, TH", lat: 13.7563, lng: 100.5018, t: "Asia/Bangkok" },
      { n: "Buenos Aires, AR", lat: -34.6037, lng: -58.3816, t: "America/Argentina/Buenos_Aires" },
      { n: "Johannesburg, ZA", lat: -26.2041, lng: 28.0473, t: "Africa/Johannesburg" }
    ];

    const eventList = document.getElementById('event-list');
    let eventsCount = 0;
    const MAX_EVENTS = 50;

    function generateRandomIP() {
      return `${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}`;
    }

    function generateRandomUser() {
      const prefixes = ['ANON', 'GHOST', 'NODE', 'LINK', 'SYS', 'USER', 'OP', 'NET'];
      return `${prefixes[Math.floor(Math.random()*prefixes.length)]}_${Math.floor(1000 + Math.random()*8999)}`;
    }

    function addEvent() {
      const city = CITIES[Math.floor(Math.random() * CITIES.length)];
      
      // Add slight jitter to lat/lng so they aren't always exactly the same spot
      const lat = city.lat + (Math.random() - 0.5) * 2;
      const lng = city.lng + (Math.random() - 0.5) * 2;

      // 1. Draw Ping on Map
      drawPing(lat, lng);

      // 2. Add to list
      const ip = (Math.random() > 0.4) ? generateRandomIP() : 'ENCRYPTED';
      const user = generateRandomUser();
      const now = new Date();
      const timeStr = now.toISOString().split('T')[1].slice(0, 8) + '.' + Math.floor(now.getMilliseconds()/100);

      const item = document.createElement('div');
      item.className = 'event-item';
      item.innerHTML = `
        <div class="event-header">
          <span class="event-user">▸ ${user} // ${ip}</span>
          <span class="event-time">${timeStr}</span>
        </div>
        <div class="event-loc">
          <div class="loc-dot"></div>
          CONNECTED FROM: ${city.n.toUpperCase()}
        </div>
      `;

      eventList.prepend(item);
      eventsCount++;

      if (eventsCount > MAX_EVENTS) {
        if(eventList.lastChild) eventList.removeChild(eventList.lastChild);
        eventsCount--;
      }
    }

    function drawPing(lat, lng) {
      const latlng = L.latLng(lat, lng);
      // We'll project to get x/y pixels from the map container
      
      // Since leaflet redraws on drag/zoom, attaching custom DOM to the map container overlay is better via custom Leaflet panes or markers.
      // Easiest is to use custom HTML icon marker
      
      const iconHTML = `
        <div style="position:relative;">
          <div class="presence-dot"></div>
          <div class="presence-ping"></div>
        </div>
      `;
      
      const icon = L.divIcon({
        html: iconHTML,
        className: 'ping-marker',
        iconSize: [0, 0]
      });

      const marker = L.marker(latlng, { icon: icon }).addTo(map);

      // Remove after animation completes (3 seconds)
      setTimeout(() => {
        map.removeLayer(marker);
      }, 3000);
    }

    // Initialize with a few events
    for(let i=0; i<5; i++) {
      setTimeout(addEvent, i * 400);
    }

    // Loop
    function scheduleNextEvent() {
      const delay = Math.random() * 2500 + 500; // 0.5 to 3s
      setTimeout(() => {
        addEvent();
        scheduleNextEvent();
      }, delay);
    }
    
    setTimeout(scheduleNextEvent, 2000);

  })();
  </script>
</body>
</html>
