<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta name="description" content="VOID // VOID_BEATS — Sleek Dark Minimalist Audio Deck."/>
  <title>VOID_BEATS // Modern Audio Deck</title>
  
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-void.png">
  <link rel="shortcut icon" type="image/png" href="assets/icon-void.png">

  <!-- Typography & Icons -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS Framework -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "emerald-accent": "#10b981",
            "deck-bg": "#0b0b0f",
            "deck-surface": "#121216",
            "deck-card": "#17171d",
            "deck-border": "rgba(255, 255, 255, 0.08)"
          },
          fontFamily: {
            "sans": ["Inter", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
            "display": ["Space Grotesk", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #070709;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Razor-thin transparent custom scrollbar */
    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Range slider custom styling */
    input[type="range"] {
      accent-color: #10b981;
    }

    /* Scrubber hover thumb */
    .scrubber-track:hover .scrubber-thumb {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.2);
    }

    /* Vinyl artwork glow */
    .album-vinyl-glow {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(11, 11, 15, 0.8) 100%);
      pointer-events: none;
    }
  </style>
</head>
<body class="selection:bg-emerald-500 selection:text-black">

       MINIMALIST TOP HEADER

  <!-- ==========================================
       MAIN AUDIO DECK
       ========================================== -->
  <main class="flex-1 max-w-[1080px] w-full mx-auto p-4 md:p-8 flex flex-col justify-center">
    
    <!-- Outer Deck Window: Subtle dark glass border & rounded-2xl -->
    <div class="relative bg-[#0b0b0f] border border-white/[0.08] rounded-2xl shadow-[0_30px_70px_rgba(0,0,0,0.85),0_0_40px_rgba(16,185,129,0.06)] overflow-hidden flex flex-col">
      
      <!-- Deck Top Bar -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-white/[0.06]">
        <div class="flex items-center gap-2.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>

             LEFT PANEL: ALBUM ART & MINIMAL CONTROLS

          <!-- Sleek Thin Scrubber & Timers -->

            <!-- Loop -->

              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/>

            </button>

          <!-- Bottom Volume Bar -->

        </div>

        <!-- ==========================================
             RIGHT PANEL: CLEAN MODERN PLAYLIST & SEARCH
             ========================================== -->
        <div class="md:col-span-6 lg:col-span-6 p-6 md:p-7 bg-white/[0.015] flex flex-col justify-between">
          
          <div>
            <!-- Minimal Search Pill -->
            <div class="relative mb-3.5">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-500">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </div>
              <input type="text" 
                     id="search-input" 
                     placeholder="Search tracks, artists, or enter query..." 
                     class="w-full bg-neutral-900/80 border border-neutral-800 rounded-full pl-9 pr-4 py-2.5 text-sm text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-500 transition-colors"

            <!-- Filter Pills: Sleek modern rounded chips -->
            <div class="flex flex-wrap gap-2 mb-4" id="filter-tabs">
              <button class="filter-tab active px-3.5 py-1 text-xs rounded-full bg-white text-black font-semibold cursor-pointer transition-colors" data-filter="all">All</button>

              <button class="filter-tab px-3.5 py-1 text-xs rounded-full bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white cursor-pointer transition-colors" data-filter="synthwave">Synthwave</button>
              <button class="filter-tab px-3.5 py-1 text-xs rounded-full bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white cursor-pointer transition-colors" data-filter="ambient">Ambient</button>
            </div>

            <!-- Spacious Track Rows Container -->
            <div id="playlist-container" class="custom-scrollbar space-y-1 max-h-[380px] overflow-y-auto pr-1">
              <!-- Dynamically populated -->
            </div>

          <!-- Playlist Footer Status -->
          <div class="pt-3 mt-3 border-t border-white/[0.06] flex items-center justify-between text-xs text-neutral-500">
            <span id="track-library-count">3 Tracks</span>
            <span class="font-mono text-[11px] text-neutral-400 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>

  <!-- ==========================================
       MINIMAL FOOTER
       ========================================== -->

    <span>VOID // MODERN AUDIO DECK</span>
  </footer>

  <!-- Hidden YouTube IFrame Container (offscreen, zero-size) -->
  <div id="yt-hidden-player" style="position:absolute;top:-9999px;left:-9999px;width:1px;height:1px;pointer-events:none;"></div>

  <!-- YouTube IFrame API (async — won't block render) -->
  <script src="https://www.youtube.com/iframe_api" defer></script>

  <!-- ==========================================
       VOID_BEATS ENGINE v3 — Dual-Mode Player
       Local (HTML5) + YouTube IFrame API
       ========================================== -->
  <script>
  (() => {
    'use strict';

    // ─────────────────────────────────────────────────────────────
    // CONSTANTS
    // ─────────────────────────────────────────────────────────────

    // Search API cascade: Piped first (returns items[]), then Invidious instances
    const SEARCH_APIS = [
      q => `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(q)}&filter=music_songs`,
      q => `https://yt.artemislena.eu/api/v1/search?q=${encodeURIComponent(q)}&type=video`,
      q => `https://invidious.io.lol/api/v1/search?q=${encodeURIComponent(q)}&type=video`,
      q => `https://iv.datura.network/api/v1/search?q=${encodeURIComponent(q)}&type=video`
    ];

    const FALLBACK_COVER = 'assets/images/album-art.png';
    const DEBOUNCE_MS    = 480;

    // ─────────────────────────────────────────────────────────────
    // STATE
    // ─────────────────────────────────────────────────────────────
    let LOCAL_TRACKS  = [];          // stable set from tracks.json
    let TRACKS        = [];          // active displayed set
    let currentIndex  = 0;
    let isLooping     = true;
    let isShuffle     = false;
    let activeFilter  = 'all';
    let searchQuery   = '';
    let isSearchMode  = false;       // true → showing YT results
    let debounceTimer = null;
    let scrubInterval = null;        // polls YT player for scrubber
    let currentMode   = 'local';     // 'local' | 'youtube'

    // ─────────────────────────────────────────────────────────────
    // HTML5 AUDIO (local tracks)
    // ─────────────────────────────────────────────────────────────
    if (!window.voidAudio) {
      window.voidAudio = document.getElementById('void-core-audio');
    }
    const audio = window.voidAudio;

    // ─────────────────────────────────────────────────────────────
    // YOUTUBE IFRAME PLAYER
    // ─────────────────────────────────────────────────────────────
    let ytPlayer = null;
    let ytReady  = false;

    // Called automatically by the YT IFrame API script when loaded
    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player('yt-hidden-player', {
        height: '1', width: '1',
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1 },
        events: {
          onReady:       () => { ytReady = true; },
          onStateChange: onYtStateChange
        }
      });
    };

    function onYtStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        syncPlaybackUI(true);
        startScrubPoll();
      } else if (event.data === YT.PlayerState.PAUSED) {
        syncPlaybackUI(false);
        stopScrubPoll();
      } else if (event.data === YT.PlayerState.ENDED) {
        stopScrubPoll();
        if (!isLooping) {
          isShuffle
            ? loadTrack(Math.floor(Math.random() * TRACKS.length), true)
            : loadTrack(currentIndex + 1, true);
        } else {
          ytPlayer.playVideo(); // manual loop
        }
      }
    }

    // Scrubber polling for YouTube (HTML5 has native timeupdate)
    function startScrubPoll() {
      stopScrubPoll();
      scrubInterval = setInterval(() => {
        if (!ytPlayer || currentMode !== 'youtube') return;
        const cur = ytPlayer.getCurrentTime() || 0;
        const dur = ytPlayer.getDuration()    || 0;
        updateScrubberDisplay(cur, dur);
      }, 250);
    }

    function stopScrubPoll() {
      clearInterval(scrubInterval);
      scrubInterval = null;
    }

    // ─────────────────────────────────────────────────────────────
    // UI REFS
    // ─────────────────────────────────────────────────────────────
    const mainTitle     = document.getElementById('current-track-title') || document.getElementById('main-track-title');
    const mainArtist    = document.getElementById('current-track-artist') || document.getElementById('main-track-artist');
    const mainAlbumImg  = document.getElementById('album-cover-img') || document.getElementById('main-album-img');
    const ctrlPlay      = document.getElementById('ctrl-play');
    const iconPlay      = document.getElementById('icon-play');
    const iconPause     = document.getElementById('icon-pause');
    const ctrlPrev      = document.getElementById('ctrl-prev');
    const ctrlNext      = document.getElementById('ctrl-next');
    const ctrlLoop      = document.getElementById('ctrl-loop');
    const ctrlShuffle   = document.getElementById('ctrl-shuffle');
    const scrubCurrent  = document.getElementById('scrubber-current');
    const scrubDuration = document.getElementById('scrubber-duration');
    const scrubFill     = document.getElementById('scrubber-fill');
    const scrubThumb    = document.getElementById('scrubber-thumb');
    const scrubTrack    = document.getElementById('scrubber-track');
    const volSlider     = document.getElementById('volume-slider');
    const volLabel      = document.getElementById('volume-label');
    const trackListEl   = document.getElementById('playlist-container') || document.getElementById('track-list');
    const searchInput   = document.getElementById('search-input');
    const filterTabs    = document.querySelectorAll('.filter-tab');
    const trackCountEl  = document.getElementById('track-library-count');
    const statusText    = document.getElementById('deck-status-text');

    // ─────────────────────────────────────────────────────────────
    // HELPERS
    // ─────────────────────────────────────────────────────────────
    function fmt(sec) {
      if (!sec || isNaN(sec) || sec < 0) return '00:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    }

    function esc(s) {
      return String(s||'')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function cover(c) { return c || FALLBACK_COVER; }

    // Normalise tracks.json entry
    function normaliseLocal(t, i) {
      return {
        id:      String(t.id || i),
        title:   t.title   || 'Unknown',
        artist:  t.artist  || 'Unknown',
        channel: (t.category || 'all').toLowerCase().replace(/[-\s]/g,''),
        cover:   cover(t.cover),
        duration:t.duration || '00:00',
        src:     t.url || t.src || 'music.mp3',
        isYt:    false
      };
    }

    // Normalise Piped API result (items[])
    function normalisePiped(item) {
      const vid = (item.url || '').replace('/watch?v=','').split('&')[0] || item.videoId || '';
      return {
        id:      vid,
        title:   item.title || 'YouTube Track',
        artist:  item.uploaderName || item.author || 'Unknown',
        channel: 'yt',
        cover:   item.thumbnail || FALLBACK_COVER,
        duration:typeof item.duration === 'number'
                   ? fmt(item.duration)
                   : (item.duration || '03:30'),
        src:     vid, // video ID used by YT IFrame
        isYt:    true
      };
    }

    // Normalise Invidious API result
    function normaliseInvidious(item) {
      const thumb = (item.videoThumbnails || []).find(t => t.quality==='medium')
                 || (item.videoThumbnails||[])[0] || {};
      return {
        id:      item.videoId || '',
        title:   item.title  || 'YouTube Track',
        artist:  item.author || 'Unknown',
        channel: 'yt',
        cover:   thumb.url   || FALLBACK_COVER,
        duration:fmt(item.lengthSeconds || 0),
        src:     item.videoId || '',
        isYt:    true
      };
    }

    // ─────────────────────────────────────────────────────────────
    // PLAYBACK CORE
    // ─────────────────────────────────────────────────────────────
    function loadTrack(index, autoPlay = false) {
      if (!TRACKS.length) return;
      currentIndex = ((index % TRACKS.length) + TRACKS.length) % TRACKS.length;
      const t = TRACKS[currentIndex];

      // Left panel update
      if (mainTitle)    mainTitle.textContent  = t.title;
      if (mainArtist)   mainArtist.textContent = t.artist;
      if (mainAlbumImg) {
        mainAlbumImg.src = cover(t.cover);
        mainAlbumImg.onerror = () => { mainAlbumImg.src = FALLBACK_COVER; };
      }
      if (scrubDuration) scrubDuration.textContent = t.duration;
      resetScrubber();

      if (t.isYt) {
        currentMode = 'youtube';
        audio.pause(); // stop any local playback
        stopScrubPoll();
        if (autoPlay) playYt(t.src);
      } else {
        currentMode = 'local';
        stopScrubPoll();
        if (ytReady && ytPlayer) ytPlayer.stopVideo();
        audio.src  = t.src;
        audio.loop = isLooping;
        if (autoPlay) playLocal();
      }

      renderTrackList();
      if (!autoPlay) syncPlaybackUI(false);
    }

    function playLocal() {
      initWebAudio();
      audio.play()
        .then(() => syncPlaybackUI(true))
        .catch(e => { console.warn('[VOID] Local playback blocked:', e); syncPlaybackUI(false); });
    }

    function playYt(videoId) {
      if (!videoId) return;
      if (!ytReady || !ytPlayer) {
        // YT API not ready yet — retry in 800ms
        setTimeout(() => playYt(videoId), 800);
        return;
      }
      ytPlayer.loadVideoById(videoId);
      // onStateChange(PLAYING) will call syncPlaybackUI(true) + startScrubPoll()
    }

    function pauseActive() {
      if (currentMode === 'youtube' && ytReady && ytPlayer) {
        ytPlayer.pauseVideo();
      } else {
        audio.pause();
        syncPlaybackUI(false);
      }
    }

    function resumeActive() {
      if (currentMode === 'youtube' && ytReady && ytPlayer) {
        ytPlayer.playVideo();
      } else {
        playLocal();
      }
    }

    function togglePlay() {
      if (currentMode === 'youtube') {
        const state = ytReady && ytPlayer ? ytPlayer.getPlayerState() : -1;
        state === YT.PlayerState.PLAYING ? pauseActive() : resumeActive();
      } else {
        audio.paused ? resumeActive() : pauseActive();
      }
    }

    function syncPlaybackUI(playing) {
      if (iconPlay)   iconPlay.classList.toggle('hidden', playing);
      if (iconPause)  iconPause.classList.toggle('hidden', !playing);
      if (statusText) statusText.textContent = playing ? 'Playing' : 'Paused';
      document.querySelectorAll('.active-track-dot').forEach(d => {
        d.style.opacity   = playing ? '1' : '0.35';
        d.style.boxShadow = playing ? '0 0 10px #10b981' : 'none';
      });
    }

    // ─────────────────────────────────────────────────────────────
    // SCRUBBER
    // ─────────────────────────────────────────────────────────────
    function resetScrubber() {
      if (scrubFill)    scrubFill.style.width  = '0%';
      if (scrubThumb)   scrubThumb.style.left  = '0%';
      if (scrubCurrent) scrubCurrent.textContent = '00:00';
    }

    function updateScrubberDisplay(cur, dur) {
      const pct = dur > 0 ? (cur / dur) * 100 : 0;
      if (scrubFill)    scrubFill.style.width  = `${pct}%`;
      if (scrubThumb)   scrubThumb.style.left  = `${pct}%`;
      if (scrubCurrent) scrubCurrent.textContent = fmt(cur);
      if (scrubDuration) scrubDuration.textContent = fmt(dur);
    }

    // HTML5 audio scrubber (local tracks)
    audio.addEventListener('timeupdate', () => {
      if (currentMode !== 'local') return;
      updateScrubberDisplay(audio.currentTime, audio.duration);
    });
    audio.addEventListener('play',  () => { if (currentMode==='local') syncPlaybackUI(true); });
    audio.addEventListener('pause', () => { if (currentMode==='local') syncPlaybackUI(false); });
    audio.addEventListener('ended', () => {
      if (currentMode !== 'local') return;
      if (!isLooping) {
        isShuffle
          ? loadTrack(Math.floor(Math.random() * TRACKS.length), true)
          : loadTrack(currentIndex + 1, true);
      }
    });

    // Scrubber click seek
    if (scrubTrack) {
      scrubTrack.addEventListener('click', e => {
        const pct = Math.max(0, Math.min(1, (e.clientX - scrubTrack.getBoundingClientRect().left) / scrubTrack.offsetWidth));
        if (currentMode === 'youtube' && ytReady && ytPlayer) {
          const dur = ytPlayer.getDuration() || 0;
          if (dur) ytPlayer.seekTo(pct * dur, true);
        } else if (audio.duration) {
          audio.currentTime = pct * audio.duration;
        }
      });
    }

    // Volume
    if (volSlider) {
      volSlider.addEventListener('input', e => {
        const v = e.target.value;
        audio.volume = v / 100;
        if (ytReady && ytPlayer) ytPlayer.setVolume(Number(v));
        if (volLabel) volLabel.textContent = `${v}%`;
      });
    }

    // ─────────────────────────────────────────────────────────────
    // TRANSPORT CONTROLS
    // ─────────────────────────────────────────────────────────────
    if (ctrlPlay)    ctrlPlay.addEventListener('click',    togglePlay);
    if (ctrlPrev)    ctrlPrev.addEventListener('click',    () => isShuffle ? loadTrack(Math.floor(Math.random()*TRACKS.length),true) : loadTrack(currentIndex-1,true));
    if (ctrlNext)    ctrlNext.addEventListener('click',    () => isShuffle ? loadTrack(Math.floor(Math.random()*TRACKS.length),true) : loadTrack(currentIndex+1,true));
    if (ctrlLoop)    ctrlLoop.addEventListener('click',    () => {
      isLooping = !isLooping;
      audio.loop = isLooping;
      ctrlLoop.classList.toggle('text-emerald-400', isLooping);
      ctrlLoop.classList.toggle('text-neutral-400', !isLooping);
      ctrlLoop.title = isLooping ? 'Repeat: On' : 'Repeat: Off';
    });
    if (ctrlShuffle) ctrlShuffle.addEventListener('click', () => {
      isShuffle = !isShuffle;
      ctrlShuffle.classList.toggle('text-emerald-400', isShuffle);
      ctrlShuffle.classList.toggle('text-neutral-400', !isShuffle);
      ctrlShuffle.title = isShuffle ? 'Shuffle: On' : 'Shuffle: Off';
    });
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); togglePlay(); }
    });

    // ─────────────────────────────────────────────────────────────
    // RENDER PLAYLIST
    // ─────────────────────────────────────────────────────────────
    function renderTrackList(override) {
      if (!trackListEl) return;
      const list = override || TRACKS;

      const filtered = isSearchMode ? list : list.filter(t => {
        return activeFilter === 'all' || t.channel === activeFilter;
      });

      if (trackCountEl) {
        trackCountEl.textContent = isSearchMode
          ? `${filtered.length} YouTube Results`
          : `${filtered.length} ${filtered.length===1?'Track':'Tracks'}`;
      }

      if (filtered.length === 0) {
        trackListEl.innerHTML = `<div class="py-10 text-center text-sm text-neutral-500">No tracks found.</div>`;
        return;
      }

      trackListEl.innerHTML = '';
      filtered.forEach(track => {
        const origIdx  = TRACKS.findIndex(t => t.id === track.id);
        const isActive = origIdx !== -1 && origIdx === currentIndex;

        const row = document.createElement('div');
        row.className = `flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer transition-all duration-150 group ${isActive ? 'bg-emerald-500/10' : 'hover:bg-white/5'}`;
        row.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden min-w-0">
            <div class="relative w-10 h-10 rounded-lg overflow-hidden bg-neutral-900 shrink-0">
              <img src="${esc(cover(track.cover))}" alt="${esc(track.title)}"
                   class="w-full h-full object-cover" onerror="this.src='${FALLBACK_COVER}'">
              ${isActive ? `<div class="absolute inset-0 bg-black/50 flex items-center justify-center">
                <span class="active-track-dot w-2 h-2 rounded-full bg-emerald-500" style="box-shadow:0 0 10px #10b981"></span>
              </div>` : ''}
            </div>
            <div class="min-w-0 overflow-hidden">
              <div class="text-sm font-semibold truncate ${isActive?'text-emerald-400':'text-white group-hover:text-emerald-300 transition-colors'}">${esc(track.title)}</div>
              <div class="text-xs text-neutral-400 truncate mt-0.5">${esc(track.artist)}</div>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0 pl-2">
            ${track.isYt ? `<span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-red-500/15 text-red-400 border border-red-500/20">YT</span>` : ''}
            <span class="text-xs font-mono ${isActive?'text-emerald-400':'text-neutral-500'}">${esc(track.duration)}</span>
          </div>`;

        row.addEventListener('click', () => {
          if (origIdx === -1) {
            // New YT result — add to TRACKS, play it
            TRACKS.push(track);
            loadTrack(TRACKS.length - 1, true);
          } else {
            loadTrack(origIdx, true);
          }
        });

        trackListEl.appendChild(row);
      });
    }

    // ─────────────────────────────────────────────────────────────
    // LIVE YOUTUBE SEARCH — Piped + Invidious cascade
    // ─────────────────────────────────────────────────────────────
    function showSearchSpinner(query) {
      if (!trackListEl) return;
      trackListEl.innerHTML = `
        <div class="py-10 flex flex-col items-center gap-3 text-neutral-500">
          <svg class="animate-spin w-5 h-5 text-emerald-500" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          <span class="text-sm">Searching YouTube for <span class="text-emerald-400">"${esc(query)}"</span>…</span>
          <span class="text-xs text-neutral-600 font-mono">// QUERYING FREQUENCIES</span>
        </div>`;
    }

    function showSearchError() {
      if (!trackListEl) return;
      trackListEl.innerHTML = `
        <div class="py-10 text-center">
          <div class="text-sm text-red-400 font-mono mb-1">// STREAM_ERROR: ALL FREQUENCIES OFFLINE</div>
          <div class="text-xs text-neutral-500 mt-2">All search APIs timed out. Check your connection and retry.</div>
          <button onclick="document.getElementById('search-input').dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}))"
                  class="mt-4 px-4 py-1.5 text-xs rounded-full bg-neutral-800 border border-neutral-700 text-neutral-300 hover:border-emerald-500 hover:text-emerald-400 transition-colors cursor-pointer">
            Retry
          </button>
        </div>`;
    }

    // Global Audio Instance
    window.voidAudioPlayer = window.voidAudioPlayer || audio || new Audio();

    // Live Search Function (Direct CORS-Friendly Endpoint)
    async function executeGlobalSearch(query) {
      const container = document.getElementById('playlist-container') || trackListEl;
      if (!container) return;

      container.innerHTML = `
        <div class="text-xs text-neutral-400 p-6 text-center animate-pulse font-mono">
          // SEARCHING SATELLITE FREQUENCIES FOR: "${query}"...
        </div>`;

      try {
        let fetchedTracks = [];

        // Public unblocked Saavn API mirror
        try {
          const response = await fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(query)}&page=1&limit=15`);
          if (response.ok) {
            const result = await response.json();
            if (result && result.success && result.data && result.data.results && result.data.results.length > 0) {
              fetchedTracks = result.data.results.map(item => {
                const downloadUrls = item.downloadUrl || [];
                const bestAudio = downloadUrls[downloadUrls.length - 1]?.url || downloadUrls[0]?.url;
                const images = item.image || [];
                const bestImage = images[images.length - 1]?.url || images[0]?.url || 'assets/images/album-art.png';

                return {
                  id: item.id,
                  title: item.name.replace(/&quot;/g, '"').replace(/&#039;/g, "'"),
                  artist: (item.artists?.primary?.map(a => a.name).join(', ')) || "Unknown Artist",
                  duration: formatSeconds(item.duration),
                  cover: bestImage,
                  streamUrl: bestAudio
                };
              }).filter(t => t.streamUrl);
            }
          }
        } catch (e) {
          console.warn("Saavn primary mirror unreachable, using live zero-CORS satellite fallback:", e);
        }

        // Zero-CORS live music satellite stream fallback if Saavn DNS/endpoint is down
        if (fetchedTracks.length === 0) {
          try {
            const itunesRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=15`);
            if (itunesRes.ok) {
              const itunesData = await itunesRes.json();
              if (itunesData.results && itunesData.results.length > 0) {
                fetchedTracks = itunesData.results.map((item, idx) => ({
                  id: item.trackId || idx,
                  title: (item.trackName || "Unknown Track").replace(/&quot;/g, '"').replace(/&#039;/g, "'"),
                  artist: item.artistName || "Unknown Artist",
                  duration: formatSeconds(Math.floor((item.trackTimeMillis || 0) / 1000)),
                  cover: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '600x600bb') : 'assets/images/album-art.png',
                  streamUrl: item.previewUrl
                })).filter(t => t.streamUrl);
              }
            }
          } catch (fbErr) {
            console.warn("Satellite query error:", fbErr);
          }
        }

        if (fetchedTracks.length === 0) {
          container.innerHTML = `<div class="text-xs text-neutral-500 p-6 text-center font-mono">// NO SIGNALS FOUND ON FREQUENCY.</div>`;
          return;
        }

        renderTracksList(fetchedTracks);

      } catch (error) {
        console.error("Audio Signal Error:", error);
        container.innerHTML = `<div class="text-xs text-red-400 p-6 text-center font-mono">// TRANSMISSION FAILED. CHECK CONNECTION.</div>`;
      }
    }

    function formatSeconds(sec) {
      const total = parseInt(sec, 10) || 0;
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Render dynamic track list
    function renderTracksList(tracks) {
      const container = document.getElementById('playlist-container') || trackListEl;
      if (!container) return;
      container.innerHTML = '';

      if (trackCountEl) trackCountEl.textContent = `${tracks.length} ${tracks.length === 1 ? 'Track' : 'Tracks'}`;

      tracks.forEach((track, index) => {
        const row = document.createElement('div');
        row.className = "flex items-center justify-between p-2.5 rounded-xl hover:bg-white/5 cursor-pointer transition group";
        row.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <img src="${track.cover}" class="w-10 h-10 rounded-lg object-cover border border-white/5" alt="cover" onerror="this.src='assets/images/album-art.png'">
            <div class="truncate">
              <div class="text-sm text-white font-medium truncate group-hover:text-emerald-400 transition">${track.title}</div>
              <div class="text-xs text-neutral-400 truncate">${track.artist}</div>
            </div>
          </div>
          <div class="text-xs text-neutral-500 font-mono pl-3">${track.duration}</div>
        `;

        row.addEventListener('click', () => {
          document.querySelectorAll('#playlist-container > div').forEach(r => r.classList.remove('bg-emerald-500/10'));
          row.classList.add('bg-emerald-500/10');
          playTrack(track);
        });
        container.appendChild(row);
      });
    }

    // Play selected track
    function playTrack(track) {
      if (!track.streamUrl) return;

      currentMode = 'local';
      if (ytReady && ytPlayer && ytPlaying) ytPlayer.pauseVideo();

      const playerAudio = window.voidAudioPlayer;
      playerAudio.src = track.streamUrl;
      playerAudio.play().catch(e => console.warn("Playback error:", e));

      // Update Left Panel UI
      const titleEl = document.getElementById('current-track-title');
      const artistEl = document.getElementById('current-track-artist');
      const coverEl = document.getElementById('album-cover-img');

      if (titleEl) titleEl.innerText = track.title;
      if (artistEl) artistEl.innerText = track.artist;
      if (coverEl) coverEl.src = track.cover;

      syncPlaybackUI(true);
      initWebAudio();
    }

    function exitSearchMode() {
      isSearchMode = false;
      searchQuery = '';
      if (searchInput) searchInput.value = '';
    }

    // Force Input Event Attachment:
    // Locate the search bar inside the modal/page
    const searchBar = document.querySelector('input[type="text"][placeholder*="Search"]');

    if (searchBar) {
      // Remove existing cloned listeners
      const newSearchBar = searchBar.cloneNode(true);
      searchBar.parentNode.replaceChild(newSearchBar, searchBar);

      newSearchBar.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const query = newSearchBar.value.trim();
          if (query.length > 0) {
            executeGlobalSearch(query);
          } else {
            renderTrackList();
          }
        }
        if (e.key === 'Escape') {
          newSearchBar.value = '';
          exitSearchMode();
          renderTrackList();
        }
      });
    }

    // ─────────────────────────────────────────────────────────────
    // CATEGORY FILTER CHIPS
    // ─────────────────────────────────────────────────────────────
    filterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        if (isSearchMode) exitSearchMode();

        filterTabs.forEach(t => {
          t.classList.remove('bg-white','text-black','font-semibold');
          t.classList.add('bg-neutral-900','border','border-neutral-800','text-neutral-400');
        });
        tab.classList.add('bg-white','text-black','font-semibold');
        tab.classList.remove('bg-neutral-900','border','border-neutral-800','text-neutral-400');

        activeFilter = tab.dataset.filter;
        renderTrackList();
      });
    });

    // ─────────────────────────────────────────────────────────────
    // WEB AUDIO API — Visualizer (local playback only)
    // ─────────────────────────────────────────────────────────────
    const canvas = document.getElementById('deck-visualizer-canvas');
    const vCtx   = canvas?.getContext('2d') || null;
    let audioCtx = null, analyser = null, srcNode = null;

    function initWebAudio() {
      if (audioCtx) { if (audioCtx.state==='suspended') audioCtx.resume(); return; }
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        srcNode = audioCtx.createMediaElementSource(audio);
        srcNode.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch(e) { console.warn('[VOID] Web Audio init:', e); }
    }

    function resizeCanvas() {
      if (!canvas) return;
      canvas.width  = canvas.parentElement?.clientWidth || 300;
      canvas.height = 70;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderVisualizer() {
      requestAnimationFrame(renderVisualizer);
      if (!vCtx) return;
      const W = canvas.width, H = canvas.height;
      vCtx.clearRect(0,0,W,H);

      if (!analyser || audio.paused || currentMode==='youtube') {
        const t = Date.now() * 0.003;
        vCtx.beginPath();
        vCtx.lineWidth=1.5; vCtx.strokeStyle='#10b981';
        vCtx.shadowBlur=6; vCtx.shadowColor='rgba(16,185,129,.4)';
        for (let x=0;x<W;x+=2) {
          const y = H/2 + Math.sin(x*.035+t)*10*Math.abs(Math.sin(t*.4)) + Math.cos(x*.06+t)*5;
          x===0 ? vCtx.moveTo(x,y) : vCtx.lineTo(x,y);
        }
        vCtx.stroke(); vCtx.shadowBlur=0; return;
      }

      const buf = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteTimeDomainData(buf);
      vCtx.lineWidth=1.5; vCtx.strokeStyle='#10b981';
      vCtx.shadowBlur=8; vCtx.shadowColor='rgba(16,185,129,.65)';
      vCtx.beginPath();
      const step = W/buf.length;
      let x=0;
      for (let i=0;i<buf.length;i++) {
        const y=(buf[i]/128)*(H/2);
        i===0 ? vCtx.moveTo(x,y) : vCtx.lineTo(x,y);
        x+=step;
      }
      vCtx.lineTo(W,H/2); vCtx.stroke(); vCtx.shadowBlur=0;
    }

    // ─────────────────────────────────────────────────────────────
    // BOOT — load tracks.json → render → start visualizer
    // ─────────────────────────────────────────────────────────────
    async function init() {
      try {
        const res = await fetch('assets/data/tracks.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        LOCAL_TRACKS = (await res.json()).map(normaliseLocal);
      } catch (e) {
        console.warn('[VOID] tracks.json unavailable, using fallback.', e);
        LOCAL_TRACKS = [
          { id:'1', title:'Neon Rain Cyberpunk', artist:'Cybermind',    channel:'lofi',     cover:FALLBACK_COVER, duration:'03:45', src:'music.mp3', isYt:false },
          { id:'2', title:'Synthetic Horizon',   artist:'Neural Drift', channel:'synthwave', cover:FALLBACK_COVER, duration:'04:12', src:'music.mp3', isYt:false },
          { id:'3', title:'Static Rain 99',       artist:'Void Entity',  channel:'ambient',   cover:FALLBACK_COVER, duration:'05:10', src:'music.mp3', isYt:false }
        ];
      }
      TRACKS = [...LOCAL_TRACKS];
      loadTrack(0, false);
      renderVisualizer();
    }

    init();

  })();
  </script>
