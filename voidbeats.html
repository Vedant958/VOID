<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta name="description" content="VOID // VOID_BEATS — Sleek Dark Minimalist Audio Deck."/>
  <title>VOID_BEATS // Modern Audio Deck</title>
  
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-void.png">
  <link rel="shortcut icon" type="image/png" href="assets/icon-void.png">

  <!-- Typography & Icons -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS Framework -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "emerald-accent": "#10b981",
            "deck-bg": "#0b0b0f",
            "deck-surface": "#121216",
            "deck-card": "#17171d",
            "deck-border": "rgba(255, 255, 255, 0.08)"
          },
          fontFamily: {
            "sans": ["Inter", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
            "display": ["Space Grotesk", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #070709;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Razor-thin transparent custom scrollbar */
    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Range slider custom styling */
    input[type="range"] {
      accent-color: #10b981;
    }

    /* Scrubber hover thumb */
    .scrubber-track:hover .scrubber-thumb {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.2);
    }

    /* Vinyl artwork glow */
    .album-vinyl-glow {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(11, 11, 15, 0.8) 100%);
      pointer-events: none;
    }
  </style>
</head>
<body class="selection:bg-emerald-500 selection:text-black">

  <!-- Persistent Root Audio Engine -->
  <audio id="void-core-audio" src="music.mp3" loop preload="auto"></audio>

  <!-- ==========================================
       MINIMALIST TOP HEADER
       ========================================== -->
  <header class="h-16 w-full px-6 md:px-12 border-b border-white/[0.06] bg-[#0b0b0f]/80 backdrop-blur-xl sticky top-0 z-40 flex items-center justify-between">
    <!-- Brand -->
    <div class="flex items-center gap-3">
      <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full shadow-[0_0_10px_#10b981]"></span>
      <a href="index.html" class="font-display font-bold text-lg tracking-wide text-white hover:text-emerald-400 transition-colors">
        VOID_BEATS
      </a>
      <span class="text-[10px] font-mono tracking-wider px-2 py-0.5 rounded bg-white/[0.05] text-neutral-400 border border-white/[0.06]">DECK</span>
    </div>

    <!-- Return Link -->
    <a href="index.html#features" class="px-4 py-1.5 rounded-full border border-white/[0.08] bg-white/[0.03] text-xs text-neutral-300 hover:text-white hover:bg-white/[0.08] hover:border-white/[0.15] transition-all flex items-center gap-2">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>

  <!-- ==========================================
       MAIN AUDIO DECK
       ========================================== -->
  <main class="flex-1 max-w-[1080px] w-full mx-auto p-4 md:p-8 flex flex-col justify-center">
    
    <!-- Outer Deck Window: Subtle dark glass border & rounded-2xl -->
    <div class="relative bg-[#0b0b0f] border border-white/[0.08] rounded-2xl shadow-[0_30px_70px_rgba(0,0,0,0.85),0_0_40px_rgba(16,185,129,0.06)] overflow-hidden flex flex-col">
      
      <!-- Deck Top Bar -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-white/[0.06]">
        <div class="flex items-center gap-2.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>
          <span class="text-xs font-semibold text-white tracking-wide">High-Fidelity Audio Deck</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-xs font-mono text-neutral-400" id="deck-status-text">Playing</span>
        </div>
      </div>

      <!-- Two-Column Audio Deck Layout -->
      <div class="grid grid-cols-1 md:grid-cols-12 items-stretch min-h-[500px]">
        
        <!-- ==========================================
             LEFT PANEL: ALBUM ART & MINIMAL CONTROLS
             ========================================== -->
        <div class="md:col-span-6 lg:col-span-6 p-6 md:p-8 flex flex-col justify-between border-b md:border-b-0 md:border-r border-white/[0.06] bg-[#0b0b0f]">
          
          <!-- Square Album Artwork -->
          <div class="relative w-full max-w-[280px] aspect-square mx-auto mb-6 rounded-2xl overflow-hidden shadow-2xl border border-white/[0.08] bg-[#121216]">
            <img src="assets/album_art.jpg" alt="Album Artwork" id="album-cover-img" class="w-full h-full object-cover block">
            <div class="album-vinyl-glow"></div>
            <!-- Subtle live visualizer overlay at bottom of album art -->
            <canvas id="deck-visualizer-canvas" class="absolute bottom-0 left-0 w-full h-[65px] pointer-events-none opacity-70 z-10" width="400" height="70"></canvas>
          </div>

          <!-- Track Metadata -->
          <div class="mb-5 text-left">
            <h2 class="text-2xl md:text-3xl font-bold text-white tracking-normal mb-1 truncate" id="current-track-title">CYBER_DRIFT_808</h2>
            <p class="text-sm text-neutral-400 font-normal truncate" id="current-track-artist">NEO_TOKYO_ARCHIVE</p>
          </div>

          <!-- Sleek Thin Scrubber & Timers -->
          <div class="mb-5">
            <div class="flex items-center gap-3 font-mono text-xs text-neutral-500">
              <span id="current-time-display" class="min-w-[36px] text-neutral-400">00:00</span>
              <div id="progress-track-container" class="scrubber-track flex-1 h-1 bg-neutral-800 hover:h-1.5 rounded-full relative cursor-pointer transition-all">

                <div id="scrubber-thumb" class="scrubber-thumb absolute top-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-white rounded-full shadow-[0_0_8px_rgba(16,185,129,0.8)] pointer-events-none opacity-0 transition-opacity" style="left: 0%;"></div>
              </div>
              <span id="total-duration-display" class="min-w-[36px] text-neutral-400 text-right">03:45</span>

          </div>

          <!-- Minimal Transport Controls Cluster -->
          <div class="flex items-center justify-center gap-4 mb-4">
            <!-- Shuffle -->
            <button id="ctrl-shuffle" class="w-9 h-9 text-neutral-400 hover:text-white rounded-full flex items-center justify-center transition-colors cursor-pointer" title="Shuffle">

            <!-- Previous -->
            <button id="ctrl-prev" class="w-10 h-10 text-neutral-300 hover:text-white rounded-full flex items-center justify-center hover:scale-110 active:scale-95 transition-all cursor-pointer" title="Previous Track">

              </svg>
            </button>

            <!-- Play / Pause: Large circular white/emerald button -->
            <button id="play-pause-btn" class="w-14 h-14 bg-white text-black hover:bg-emerald-500 hover:text-black rounded-full flex items-center justify-center shadow-[0_4px_20px_rgba(255,255,255,0.2)] hover:shadow-[0_6px_24px_rgba(16,185,129,0.5)] hover:scale-105 active:scale-95 transition-all cursor-pointer" title="Play / Pause">
              <svg id="icon-play" class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5.14v14l11-7-11-7z"/>
              </svg>
              <svg id="icon-pause" class="w-6 h-6 hidden" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="5" width="4" height="14" rx="1"/>
                <rect x="14" y="5" width="4" height="14" rx="1"/>

            </button>

            <!-- Next -->
            <button id="ctrl-next" class="w-10 h-10 text-neutral-300 hover:text-white rounded-full flex items-center justify-center hover:scale-110 active:scale-95 transition-all cursor-pointer" title="Next Track">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
              </svg>
            </button>

            <!-- Loop -->
            <button id="ctrl-loop" class="w-9 h-9 text-emerald-400 hover:text-emerald-300 rounded-full flex items-center justify-center transition-colors cursor-pointer" title="Repeat: On">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/>
              </svg>
            </button>
          </div>

          <!-- Bottom Volume Bar -->
          <div class="flex items-center justify-end gap-2 text-neutral-400 text-xs">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <input id="volume-slider" type="range" min="0" max="100" value="80" class="w-20 h-1 bg-neutral-800 rounded-full cursor-pointer accent-emerald-500">
            <span id="volume-label" class="w-7 text-right font-mono text-neutral-400">80%</span>
          </div>

        </div>

        <!-- ==========================================
             RIGHT PANEL: CLEAN MODERN PLAYLIST & SEARCH
             ========================================== -->
        <div class="md:col-span-6 lg:col-span-6 p-6 md:p-7 bg-white/[0.015] flex flex-col justify-between">
          
          <div>
            <!-- Minimal Search Pill -->
            <div class="relative mb-3.5">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-500">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </div>
              <input type="text" 
                     id="search-input" 
                     placeholder="Search tracks, artists, or enter query..." 
                     class="w-full bg-neutral-900/80 border border-neutral-800 rounded-full pl-9 pr-4 py-2.5 text-sm text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-500 transition-colors" 
                     autocomplete="off" 
                     spellcheck="false">
            </div>

            <!-- Filter Pills: Sleek modern rounded chips -->
            <div class="flex flex-wrap gap-2 mb-4" id="filter-tabs">
              <button class="filter-tab active px-3.5 py-1 text-xs rounded-full bg-white text-black font-semibold cursor-pointer transition-colors" data-filter="all">All</button>
              <button class="filter-tab px-3.5 py-1 text-xs rounded-full bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white cursor-pointer transition-colors" data-filter="lofi">Lo-Fi</button>
              <button class="filter-tab px-3.5 py-1 text-xs rounded-full bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white cursor-pointer transition-colors" data-filter="synthwave">Synthwave</button>
              <button class="filter-tab px-3.5 py-1 text-xs rounded-full bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white cursor-pointer transition-colors" data-filter="ambient">Ambient</button>
            </div>

            <!-- Spacious Track Rows Container -->
            <div id="playlist-container" class="custom-scrollbar space-y-1 max-h-[380px] overflow-y-auto pr-1">
              <!-- Dynamically populated -->
            </div>
          </div>

          <!-- Playlist Footer Status -->
          <div class="pt-3 mt-3 border-t border-white/[0.06] flex items-center justify-between text-xs text-neutral-500">
            <span id="track-library-count">3 Tracks</span>
            <span class="font-mono text-[11px] text-neutral-400 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              VOID_BEATS
            </span>
          </div>

        </div>

      </div>

    </div>
  </main>

  <!-- ==========================================
       MINIMAL FOOTER
       ========================================== -->
  <footer class="w-full py-4 text-center text-xs text-neutral-600 font-mono">
    <span>VOID // MODERN AUDIO DECK</span>
  </footer>

  <!-- ==========================================
       VOID_BEATS ENGINE v4 — Unified High-Res Audio Engine
       iTunes Open API HD Metadata + Direct Streaming
       ========================================== -->
  <script>
  (() => {
    'use strict';

    // ─────────────────────────────────────────────────────────────
    // STATE & REFS
    // ─────────────────────────────────────────────────────────────
    const FALLBACK_COVER = 'assets/images/album-art.png';
    let LOCAL_TRACKS  = [];
    let TRACKS        = [];
    let currentIndex  = 0;
    let isLooping     = true;
    let isShuffle     = false;
    let activeFilter  = 'all';
    let isSearchMode  = false;

    // Dedicated Audio Instance (isolated from site ambient music)
    window.voidDeckAudio = window.voidDeckAudio || new Audio();
    const deckAudio = window.voidDeckAudio;
    deckAudio.preload = 'auto';

    // UI Elements
    const mainTitle     = document.getElementById('current-track-title') || document.getElementById('main-track-title');
    const mainArtist    = document.getElementById('current-track-artist') || document.getElementById('main-track-artist');
    const mainCover     = document.getElementById('album-cover-img') || document.getElementById('main-album-img');
    const playBtn       = document.getElementById('play-pause-btn') || document.getElementById('ctrl-play');
    const iconPlay      = document.getElementById('icon-play');
    const iconPause     = document.getElementById('icon-pause');
    const ctrlPrev      = document.getElementById('ctrl-prev');
    const ctrlNext      = document.getElementById('ctrl-next');
    const ctrlLoop      = document.getElementById('ctrl-loop');
    const ctrlShuffle   = document.getElementById('ctrl-shuffle');
    const curTimeEl     = document.getElementById('current-time-display') || document.getElementById('scrubber-current');
    const totalTimeEl   = document.getElementById('total-duration-display') || document.getElementById('scrubber-duration');
    const progressBar   = document.getElementById('audio-progress-bar') || document.getElementById('scrubber-fill');
    const scrubThumb    = document.getElementById('scrubber-thumb');
    const scrubTrack    = document.getElementById('progress-track-container') || document.getElementById('scrubber-track');
    const volSlider     = document.getElementById('volume-slider');
    const volLabel      = document.getElementById('volume-label');
    const playlistBox   = document.getElementById('playlist-container');
    const searchInput   = document.getElementById('search-input');
    const filterTabs    = document.querySelectorAll('.filter-tab');
    const trackCountEl  = document.getElementById('track-library-count');
    const statusText    = document.getElementById('deck-status-text');

    // ─────────────────────────────────────────────────────────────
    // UTILITIES
    // ─────────────────────────────────────────────────────────────
    function formatTime(sec) {
      if (!sec || isNaN(sec) || sec < 0) return '00:00';
      const s = Math.floor(sec);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}:${r < 10 ? '0' : ''}${r}`;
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ─────────────────────────────────────────────────────────────
    // SEARCH PIPELINE (iTunes Open API for Pristine 600x600 HD Covers)
    // ─────────────────────────────────────────────────────────────
    async function executeGlobalSearch(query) {
      if (!playlistBox) return;
      isSearchMode = true;

      playlistBox.innerHTML = `
        <div class="text-xs text-neutral-400 p-6 text-center animate-pulse font-mono">
          // TUNING FREQUENCIES FOR "${esc(query)}"...
        </div>`;

      try {
        const itunesUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=12`;
        const res = await fetch(itunesUrl);
        if (!res.ok) throw new Error(`iTunes HTTP ${res.status}`);
        const data = await res.json();
        const items = data.results || [];

        if (items.length === 0) {
          playlistBox.innerHTML = `<div class="text-xs text-neutral-500 p-6 text-center font-mono">// NO FREQUENCIES DETECTED.</div>`;
          if (trackCountEl) trackCountEl.textContent = '0 Tracks';
          return;
        }

        const tracks = items.map(item => {
          const rawArt = item.artworkUrl100 || '';
          const hdArt = rawArt ? rawArt.replace('100x100bb', '600x600bb') : FALLBACK_COVER;
          return {
            id: String(item.trackId || Math.random().toString(36).substring(2)),
            title: item.trackName || "Unknown Track",
            artist: item.artistName || "Unknown Artist",
            duration: formatTime((item.trackTimeMillis || 0) / 1000),
            cover: hdArt,
            previewUrl: item.previewUrl || ''
          };
        });

        TRACKS = tracks;
        renderTracksList(tracks);
      } catch (err) {
        console.error("iTunes search failed:", err);
        playlistBox.innerHTML = `<div class="text-xs text-red-400 p-6 text-center font-mono">// SEARCH RELAY OFFLINE. RETRY.</div>`;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // RENDER PLAYLIST TRACKS
    // ─────────────────────────────────────────────────────────────
    function renderTracksList(tracks) {
      if (!playlistBox) return;
      playlistBox.innerHTML = '';

      if (trackCountEl) {
        trackCountEl.textContent = `${tracks.length} ${tracks.length === 1 ? 'Track' : 'Tracks'}`;
      }

      tracks.forEach((track, idx) => {
        const isActive = idx === currentIndex;
        const row = document.createElement('div');
        row.className = `playlist-track-row flex items-center justify-between p-2.5 rounded-xl hover:bg-white/5 cursor-pointer transition group border border-transparent ${
          isActive ? 'bg-emerald-500/10 border-emerald-500/30' : ''
        }`;

        row.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden min-w-0">
            <div class="relative w-10 h-10 rounded-lg overflow-hidden bg-neutral-900 shrink-0">
              <img src="${esc(track.cover)}" class="w-full h-full object-cover border border-white/5" alt="cover" onerror="this.src='${FALLBACK_COVER}'">
              ${isActive ? `<div class="absolute inset-0 bg-black/40 flex items-center justify-center">
                <span class="active-track-dot w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>
              </div>` : ''}
            </div>
            <div class="min-w-0 overflow-hidden">
              <div class="text-sm font-semibold truncate ${isActive ? 'text-emerald-400' : 'text-white group-hover:text-emerald-300 transition-colors'}">${esc(track.title)}</div>
              <div class="text-xs text-neutral-400 truncate mt-0.5">${esc(track.artist)}</div>
            </div>
          </div>
          <div class="text-xs font-mono shrink-0 pl-2 ${isActive ? 'text-emerald-400' : 'text-neutral-500'}">${esc(track.duration)}</div>
        `;

        row.addEventListener('click', () => {
          currentIndex = idx;
          updatePlaylistActiveState(idx);
          playTrackDirect(track);
        });

        playlistBox.appendChild(row);
      });
    }

    function updatePlaylistActiveState(activeIdx) {
      const rows = playlistBox.querySelectorAll('.playlist-track-row');
      rows.forEach((row, i) => {
        const isCur = i === activeIdx;
        row.classList.toggle('bg-emerald-500/10', isCur);
        row.classList.toggle('border-emerald-500/30', isCur);
        const titleEl = row.querySelector('.text-sm');
        if (titleEl) {
          titleEl.classList.toggle('text-emerald-400', isCur);
          titleEl.classList.toggle('text-white', !isCur);
        }
        const durEl = row.querySelector('.font-mono');
        if (durEl) {
          durEl.classList.toggle('text-emerald-400', isCur);
          durEl.classList.toggle('text-neutral-500', !isCur);
        }
      });
    }

    // ─────────────────────────────────────────────────────────────
    // DIRECT PLAYBACK ENGINE (Dedicated deckAudio, NO BG Audio Hijack)
    // ─────────────────────────────────────────────────────────────
    let audioResolverToken = 0;

    async function playTrackDirect(track) {
      const thisToken = ++audioResolverToken;

      // 1. Immediately mute/pause any background site audio
      if (window.backgroundAmbientAudio) {
        try { window.backgroundAmbientAudio.pause(); } catch(e) {}
      }
      const coreAudio = document.getElementById('void-core-audio') || document.getElementById('bg-music');
      if (coreAudio) {
        try { coreAudio.pause(); } catch(e) {}
      }

      // 2. Immediately update deck left panel metadata
      if (mainTitle) mainTitle.textContent = track.title;
      if (mainArtist) mainArtist.textContent = track.artist;
      if (mainCover) {
        mainCover.src = track.cover || FALLBACK_COVER;
        mainCover.onerror = () => { mainCover.src = FALLBACK_COVER; };
      }
      if (totalTimeEl) totalTimeEl.textContent = track.duration || '03:45';
      resetScrubber();

      // 3. Resolve direct audio stream from Saavn mirrors
      let streamUrl = null;
      const searchQuery = `${track.title} ${track.artist}`;
      const searchEndpoints = [
        `https://saavn.dev/api/search/songs?query=${encodeURIComponent(searchQuery)}&page=1&limit=1`,
        `https://saavn-api-one.vercel.app/search/songs?query=${encodeURIComponent(searchQuery)}`,
        `https://saavn-api.vercel.app/search/songs?query=${encodeURIComponent(searchQuery)}`
      ];

      for (const endpoint of searchEndpoints) {
        if (thisToken !== audioResolverToken) return; // Stale request
        try {
          const res = await fetch(endpoint);
          if (!res.ok) continue;
          const json = await res.json();
          let cand = null;

          if (Array.isArray(json) && json.length > 0) {
            cand = json[0];
          } else if (json.data && Array.isArray(json.data.results) && json.data.results.length > 0) {
            cand = json.data.results[0];
          } else if (json.data && Array.isArray(json.data) && json.data.length > 0) {
            cand = json.data[0];
          }

          if (cand) {
            if (cand.downloadUrl) {
              if (Array.isArray(cand.downloadUrl)) {
                const best = cand.downloadUrl[cand.downloadUrl.length - 1];
                streamUrl = typeof best === 'string' ? best : (best.link || best.url);
              } else if (typeof cand.downloadUrl === 'string') {
                streamUrl = cand.downloadUrl;
              }
            } else if (cand.media_url) {
              streamUrl = cand.media_url;
            } else if (cand.url && typeof cand.url === 'string' && cand.url.includes('.saavncdn.com')) {
              streamUrl = cand.url;
            }
          }
          if (streamUrl) break;
        } catch (e) {
          // Fall through to next endpoint
        }
      }

      if (thisToken !== audioResolverToken) return; // Stale request

      // 4. Fallback to previewUrl or local track src if CDN audio not resolved
      if (!streamUrl) {
        streamUrl = track.previewUrl || track.src || 'music.mp3';
      }

      // 5. Stream audio strictly through window.voidDeckAudio
      deckAudio.src = streamUrl;
      deckAudio.loop = isLooping;

      // Sync volume from slider
      if (volSlider) {
        deckAudio.volume = Number(volSlider.value) / 100;
      }

      deckAudio.play()
        .then(() => syncPlaybackUI(true))
        .catch(err => {
          console.warn("Direct stream playback interrupted or blocked:", err);
          // Fallback to previewUrl if direct stream failed
          if (track.previewUrl && deckAudio.src !== track.previewUrl) {
            deckAudio.src = track.previewUrl;
            deckAudio.play().then(() => syncPlaybackUI(true)).catch(() => syncPlaybackUI(false));
          } else {
            syncPlaybackUI(false);
          }
        });
    }

    // ─────────────────────────────────────────────────────────────
    // TIMELINE, SCRUBBER & DURATION BINDINGS
    // ─────────────────────────────────────────────────────────────
    function resetScrubber() {
      if (progressBar) progressBar.style.width = '0%';
      if (scrubThumb) scrubThumb.style.left = '0%';
      if (curTimeEl) curTimeEl.textContent = '00:00';
    }

    deckAudio.ontimeupdate = () => {
      if (!deckAudio.duration || isNaN(deckAudio.duration)) return;
      const cur = deckAudio.currentTime;
      const dur = deckAudio.duration;
      const pct = Math.min(100, (cur / dur) * 100);

      if (progressBar) progressBar.style.width = `${pct}%`;
      if (scrubThumb) scrubThumb.style.left = `${pct}%`;
      if (curTimeEl) curTimeEl.textContent = formatTime(cur);
      if (totalTimeEl && dur > 1) totalTimeEl.textContent = formatTime(dur);
    };

    deckAudio.onplay  = () => syncPlaybackUI(true);
    deckAudio.onpause = () => syncPlaybackUI(false);
    deckAudio.onended = () => {
      if (!isLooping) {
        playNext();
      }
    };

    // Scrubber click seek
    if (scrubTrack) {
      scrubTrack.addEventListener('click', (e) => {
        if (!deckAudio.duration || isNaN(deckAudio.duration)) return;
        const rect = scrubTrack.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const pct = Math.max(0, Math.min(1, clickX / rect.width));
        deckAudio.currentTime = pct * deckAudio.duration;
      });
    }

    // ─────────────────────────────────────────────────────────────
    // CONTROLS & TRANSPORT
    // ─────────────────────────────────────────────────────────────
    function syncPlaybackUI(playing) {
      if (iconPlay)  iconPlay.classList.toggle('hidden', playing);
      if (iconPause) iconPause.classList.toggle('hidden', !playing);
      if (statusText) statusText.textContent = playing ? 'Playing' : 'Paused';
    }

    function togglePlay() {
      if (!deckAudio.src) {
        if (TRACKS.length > 0) {
          playTrackDirect(TRACKS[currentIndex || 0]);
        }
        return;
      }
      if (deckAudio.paused) {
        deckAudio.play().then(() => syncPlaybackUI(true)).catch(() => {});
      } else {
        deckAudio.pause();
        syncPlaybackUI(false);
      }
    }

    function playNext() {
      if (TRACKS.length === 0) return;
      if (isShuffle) {
        currentIndex = Math.floor(Math.random() * TRACKS.length);
      } else {
        currentIndex = (currentIndex + 1) % TRACKS.length;
      }
      updatePlaylistActiveState(currentIndex);
      playTrackDirect(TRACKS[currentIndex]);
    }

    function playPrev() {
      if (TRACKS.length === 0) return;
      if (isShuffle) {
        currentIndex = Math.floor(Math.random() * TRACKS.length);
      } else {
        currentIndex = (currentIndex - 1 + TRACKS.length) % TRACKS.length;
      }
      updatePlaylistActiveState(currentIndex);
      playTrackDirect(TRACKS[currentIndex]);
    }

    if (playBtn)     playBtn.addEventListener('click', togglePlay);
    if (ctrlNext)    ctrlNext.addEventListener('click', playNext);
    if (ctrlPrev)    ctrlPrev.addEventListener('click', playPrev);

    if (ctrlLoop) {
      ctrlLoop.addEventListener('click', () => {
        isLooping = !isLooping;
        deckAudio.loop = isLooping;
        ctrlLoop.classList.toggle('text-emerald-400', isLooping);
        ctrlLoop.classList.toggle('text-neutral-400', !isLooping);
        ctrlLoop.title = isLooping ? 'Repeat: On' : 'Repeat: Off';
      });
    }

    if (ctrlShuffle) {
      ctrlShuffle.addEventListener('click', () => {
        isShuffle = !isShuffle;
        ctrlShuffle.classList.toggle('text-emerald-400', isShuffle);
        ctrlShuffle.classList.toggle('text-neutral-400', !isShuffle);
        ctrlShuffle.title = isShuffle ? 'Shuffle: On' : 'Shuffle: Off';
      });
    }

    if (volSlider) {
      volSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        deckAudio.volume = Number(val) / 100;
        if (volLabel) volLabel.textContent = `${val}%`;
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        togglePlay();
      }
    });

    // ─────────────────────────────────────────────────────────────
    // SEARCH & FILTER INPUT HANDLING
    // ─────────────────────────────────────────────────────────────
    if (searchInput) {
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const q = searchInput.value.trim();
          if (q.length > 0) {
            executeGlobalSearch(q);
          } else {
            exitSearchMode();
          }
        }
        if (e.key === 'Escape') {
          searchInput.value = '';
          exitSearchMode();
        }
      });
    }

    function exitSearchMode() {
      isSearchMode = false;
      TRACKS = [...LOCAL_TRACKS];
      filterAndRenderLocal();
    }

    function filterAndRenderLocal() {
      const filtered = activeFilter === 'all'
        ? LOCAL_TRACKS
        : LOCAL_TRACKS.filter(t => t.channel === activeFilter);
      TRACKS = filtered;
      currentIndex = 0;
      renderTracksList(TRACKS);
    }

    filterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        if (isSearchMode) {
          isSearchMode = false;
          if (searchInput) searchInput.value = '';
        }
        filterTabs.forEach(t => {
          t.classList.remove('bg-white', 'text-black', 'font-semibold');
          t.classList.add('bg-neutral-900', 'border', 'border-neutral-800', 'text-neutral-400');
        });
        tab.classList.add('bg-white', 'text-black', 'font-semibold');
        tab.classList.remove('bg-neutral-900', 'border', 'border-neutral-800', 'text-neutral-400');

        activeFilter = tab.dataset.filter || 'all';
        filterAndRenderLocal();
      });
    });

    // ─────────────────────────────────────────────────────────────
    // VISUALIZER (Zero CORS Mathematical Audio Waveform)
    // ─────────────────────────────────────────────────────────────
    const canvas = document.getElementById('deck-visualizer-canvas');
    const vCtx   = canvas?.getContext('2d') || null;

    function resizeCanvas() {
      if (!canvas) return;
      canvas.width  = canvas.parentElement?.clientWidth || 300;
      canvas.height = 70;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderVisualizer() {
      requestAnimationFrame(renderVisualizer);
      if (!vCtx || !canvas) return;
      const W = canvas.width, H = canvas.height;
      vCtx.clearRect(0, 0, W, H);

      const isPlaying = !deckAudio.paused && deckAudio.currentTime > 0;
      const t = Date.now() * (isPlaying ? 0.005 : 0.0015);
      const amp = isPlaying ? 16 : 4;

      vCtx.beginPath();
      vCtx.lineWidth = 1.75;
      vCtx.strokeStyle = isPlaying ? '#10b981' : 'rgba(16, 185, 129, 0.4)';
      vCtx.shadowBlur = isPlaying ? 10 : 3;
      vCtx.shadowColor = 'rgba(16, 185, 129, 0.5)';

      for (let x = 0; x < W; x += 2) {
        const y = H / 2
          + Math.sin(x * 0.04 + t) * amp * Math.abs(Math.sin(t * 0.6))
          + Math.cos(x * 0.08 + t * 1.5) * (amp * 0.45);
        if (x === 0) vCtx.moveTo(x, y);
        else vCtx.lineTo(x, y);
      }
      vCtx.stroke();
      vCtx.shadowBlur = 0;
    }
    renderVisualizer();

    // ─────────────────────────────────────────────────────────────
    // BOOT & INITIAL TRACK LOAD
    // ─────────────────────────────────────────────────────────────
    async function boot() {
      try {
        const res = await fetch('assets/data/tracks.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        LOCAL_TRACKS = data.map((t, i) => ({
          id: String(t.id || i),
          title: t.title || 'Unknown Track',
          artist: t.artist || 'Unknown Artist',
          channel: (t.category || 'all').toLowerCase().replace(/[-\s]/g, ''),
          cover: t.cover || FALLBACK_COVER,
          duration: t.duration || '03:45',
          src: t.url || t.src || 'music.mp3'
        }));
      } catch (e) {
        console.warn('[VOID] tracks.json fallback in effect:', e);
        LOCAL_TRACKS = [
          { id: '1', title: 'Neon Rain Cyberpunk', artist: 'Cybermind', channel: 'lofi', cover: FALLBACK_COVER, duration: '03:45', src: 'music.mp3' },
          { id: '2', title: 'Synthetic Horizon', artist: 'Neural Drift', channel: 'synthwave', cover: FALLBACK_COVER, duration: '04:12', src: 'music.mp3' },
          { id: '3', title: 'Static Rain 99', artist: 'Void Entity', channel: 'ambient', cover: FALLBACK_COVER, duration: '05:10', src: 'music.mp3' }
        ];
      }

      TRACKS = [...LOCAL_TRACKS];
      currentIndex = 0;
      renderTracksList(TRACKS);

      // Populate left deck metadata with first track without autoplaying
      if (TRACKS[0]) {
        if (mainTitle) mainTitle.textContent = TRACKS[0].title;
        if (mainArtist) mainArtist.textContent = TRACKS[0].artist;
        if (mainCover) mainCover.src = TRACKS[0].cover;
        if (totalTimeEl) totalTimeEl.textContent = TRACKS[0].duration;
      }
    }

    boot();
  })();
  </script>
</body>
