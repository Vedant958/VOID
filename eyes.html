<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EYES OF THE WORLD — VOID Interface</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#0a0a0a;--surface:#111;--border:#1e1e1e;--border-bright:#2a2a2a;
      --green:#00dd55;--green-glow:rgba(0,221,85,.35);
      --red:#ff2244;--red-glow:rgba(255,34,68,.35);
      --dim:#444;--muted:#666;--text:#ccc;
      --font-display:'Orbitron',sans-serif;--font-mono:'Share Tech Mono',monospace;
    }
    html,body{height:100%;font-family:var(--font-mono);background:var(--bg);color:var(--text);overflow:hidden}

    /* TOP BAR */
    #top-bar{
      position:fixed;top:0;left:0;width:100%;z-index:200;
      display:flex;align-items:center;gap:20px;padding:10px 24px;
      background:rgba(10,10,10,.97);border-bottom:1px solid var(--border-bright);
    }
    .tb-brand{font-family:var(--font-display);font-size:13px;font-weight:900;letter-spacing:5px;color:#fff;margin-right:auto}
    .tb-brand span{color:var(--green);text-shadow:0 0 12px var(--green-glow)}
    #top-bar a{font-size:9px;letter-spacing:3px;color:var(--muted);text-decoration:none;transition:color .2s}
    #top-bar a:hover{color:var(--green)}
    .rec-badge{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:2px;color:var(--red)}
    .rec-dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red-glow);animation:recBlink 1.1s ease-in-out infinite}
    @keyframes recBlink{0%,100%{opacity:1}50%{opacity:.3}}

    /* LAYOUT */
    #layout{display:flex;height:100vh;padding-top:41px}

    /* LEFT PANEL - camera list */
    #cam-list-panel{
      width:320px;flex-shrink:0;
      background:var(--surface);border-right:1px solid var(--border-bright);
      display:flex;flex-direction:column;overflow:hidden;
    }
    #filter-bar{
      display:flex;flex-wrap:wrap;gap:2px;padding:10px;border-bottom:1px solid var(--border-bright);flex-shrink:0;
    }
    .flt{
      font-size:8px;letter-spacing:2px;padding:5px 10px;border:1px solid var(--border-bright);
      background:transparent;color:var(--muted);cursor:pointer;border-radius:2px;transition:all .2s;
    }
    .flt:hover{border-color:var(--green);color:var(--green)}
    .flt.active{background:var(--green);border-color:var(--green);color:#000;font-weight:700}
    #feed-info{
      padding:8px 12px;font-size:8px;letter-spacing:2px;color:var(--dim);
      border-bottom:1px solid var(--border);flex-shrink:0;
    }
    #feed-info span{color:var(--green)}
    #cam-list{flex:1;overflow-y:auto;padding:8px}
    #cam-list::-webkit-scrollbar{width:3px}
    #cam-list::-webkit-scrollbar-thumb{background:var(--green);border-radius:2px}

    /* CAMERA CARD */
    .cam-card{
      margin-bottom:6px;border:1px solid var(--border-bright);
      background:#0d0d0d;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;
    }
    .cam-card:hover{border-color:var(--green);box-shadow:0 0 12px rgba(0,221,85,.1)}
    .cam-card.active{border-color:var(--green);box-shadow:0 0 16px rgba(0,221,85,.2)}
    .cam-card.active .cc-name{color:var(--green)}

    /* Camera preview (CSS-animated fake feed) */
    .cc-preview{
      position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;
    }
    .cc-scanlines{
      position:absolute;inset:0;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.015) 2px,rgba(255,255,255,.015) 4px);
      pointer-events:none;z-index:3;
    }
    .cc-noise{
      position:absolute;inset:0;z-index:2;
      background:radial-gradient(ellipse at center,rgba(0,221,85,.04) 0%,transparent 70%);
      animation:noiseShift 3s ease-in-out infinite alternate;
    }
    @keyframes noiseShift{from{opacity:.4}to{opacity:1}}
    .cc-scan-line{
      position:absolute;left:0;width:100%;height:2px;
      background:linear-gradient(90deg,transparent,rgba(0,221,85,.3),transparent);
      animation:scanLine 3s linear infinite;z-index:4;
    }
    @keyframes scanLine{from{top:-2px}to{top:100%}}
    .cc-static{
      position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:6px;
    }
    .cc-static-icon{font-size:18px;opacity:.25}
    .cc-static-txt{
      font-size:7px;letter-spacing:2px;color:rgba(0,221,85,.4);
      animation:txtBlink .8s step-end infinite;
    }
    @keyframes txtBlink{0%,100%{opacity:1}50%{opacity:0}}

    /* when card is active — shows green glow */
    .cam-card.active .cc-noise{background:radial-gradient(ellipse at center,rgba(0,221,85,.12) 0%,transparent 60%)}

    .cc-overlay{
      position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
      justify-content:space-between;padding:6px 8px;pointer-events:none;
    }
    .cc-top{display:flex;justify-content:space-between;align-items:center}
    .cc-id{font-size:7px;letter-spacing:1.5px;color:rgba(0,221,85,.6)}
    .cc-live{display:flex;align-items:center;gap:4px;font-size:7px;letter-spacing:1px;color:var(--red)}
    .cc-live-dot{width:4px;height:4px;border-radius:50%;background:var(--red);animation:recBlink 1.1s ease-in-out infinite}

    .cc-name{font-family:var(--font-display);font-size:8px;font-weight:700;letter-spacing:1px;color:#fff;margin-bottom:2px}
    .cc-loc{font-size:7px;letter-spacing:1px;color:var(--dim)}
    .cc-cat{
      position:absolute;top:6px;right:8px;font-size:6px;letter-spacing:1.5px;
      border:1px solid rgba(0,221,85,.3);padding:2px 5px;color:rgba(0,221,85,.5);z-index:6;
    }

    /* main viewer - right */
    #viewer-panel{
      flex:1;display:flex;flex-direction:column;background:#000;overflow:hidden;
    }

    /* viewer header */
    #viewer-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:10px 16px;background:#0a0a0a;border-bottom:1px solid var(--border-bright);flex-shrink:0;
    }
    #viewer-title{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:2px;color:#fff}
    #viewer-meta{font-size:8px;letter-spacing:2px;color:var(--dim)}
    #viewer-ts{font-size:9px;letter-spacing:1px;color:rgba(0,221,85,.6)}
    #viewer-actions{display:flex;gap:8px}
    .vbtn{
      font-size:8px;letter-spacing:1px;padding:5px 10px;border:1px solid var(--border-bright);
      background:transparent;color:var(--muted);cursor:pointer;border-radius:2px;transition:all .2s;
    }
    .vbtn:hover{border-color:var(--green);color:var(--green)}

    /* viewer screen */
    #viewer-screen{flex:1;position:relative;background:#000;overflow:hidden}

    /* idle state */
    #viewer-idle{
      position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:16px;z-index:10;
    }
    .idle-grid{
      display:grid;grid-template-columns:repeat(3,1fr);gap:2px;opacity:.15;margin-bottom:8px;
    }
    .idle-cell{width:60px;height:40px;background:#111;border:1px solid #1a1a1a;
      display:flex;align-items:center;justify-content:center;font-size:8px;color:#333}
    .idle-title{font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:4px;color:var(--dim)}
    .idle-sub{font-size:9px;letter-spacing:3px;color:#333}

    /* viewer iframe */
    #viewer-frame{
      position:absolute;inset:0;width:100%;height:100%;border:none;
      opacity:0;transition:opacity .5s;z-index:5;
    }
    #viewer-frame.loaded{opacity:1}

    /* Loading overlay */
    #viewer-loading{
      position:absolute;inset:0;background:#000;display:none;
      flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:8;
    }
    .vl-spinner{
      width:36px;height:36px;border:2px solid #1a1a1a;
      border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .vl-text{font-size:9px;letter-spacing:3px;color:var(--dim)}
    .vl-bar{width:180px;height:2px;background:#1a1a1a;border-radius:2px;overflow:hidden;margin-top:4px}
    .vl-bar-fill{height:100%;width:0%;background:var(--green);border-radius:2px;animation:loadBar 8s linear forwards}
    @keyframes loadBar{to{width:100%}}

    /* Signal lost overlay */
    #viewer-lost{
      position:absolute;inset:0;background:rgba(0,0,0,.92);display:none;
      flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9;
    }
    .vl-lost-icon{font-size:36px;opacity:.5}
    .vl-lost-title{
      font-family:var(--font-display);font-size:16px;font-weight:900;letter-spacing:4px;
      color:var(--red);text-shadow:0 0 20px var(--red-glow);
      animation:glitch 2s step-end infinite;
    }
    @keyframes glitch{
      0%,100%{transform:none;opacity:1}
      92%{transform:none;opacity:1}
      93%{transform:translateX(-3px);opacity:.8}
      94%{transform:translateX(3px);opacity:.9}
      95%{transform:none;opacity:1}
    }
    .vl-lost-sub{font-size:9px;letter-spacing:3px;color:var(--dim)}
    .vl-lost-actions{display:flex;gap:10px;margin-top:8px}
    .vl-lost-btn{
      font-size:9px;letter-spacing:2px;padding:8px 16px;cursor:pointer;border-radius:2px;
      border:1px solid;transition:all .2s;background:transparent;
    }
    .vl-lost-btn.primary{border-color:var(--green);color:var(--green)}
    .vl-lost-btn.primary:hover{background:var(--green);color:#000}
    .vl-lost-btn.secondary{border-color:var(--border-bright);color:var(--dim)}
    .vl-lost-btn.secondary:hover{border-color:var(--muted);color:var(--text)}

    /* Viewer scanlines */
    #viewer-scanlines{
      position:absolute;inset:0;pointer-events:none;z-index:6;
      background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.08) 3px,rgba(0,0,0,.08) 6px);
    }
    /* Corner brackets */
    .vbracket{position:absolute;width:22px;height:22px;pointer-events:none;z-index:7}
    .vbracket.tl{top:12px;left:12px;border-top:1.5px solid rgba(0,221,85,.4);border-left:1.5px solid rgba(0,221,85,.4)}
    .vbracket.tr{top:12px;right:12px;border-top:1.5px solid rgba(0,221,85,.4);border-right:1.5px solid rgba(0,221,85,.4)}
    .vbracket.bl{bottom:12px;left:12px;border-bottom:1.5px solid rgba(0,221,85,.4);border-left:1.5px solid rgba(0,221,85,.4)}
    .vbracket.br{bottom:12px;right:12px;border-bottom:1.5px solid rgba(0,221,85,.4);border-right:1.5px solid rgba(0,221,85,.4)}

    /* Viewer timestamp overlay */
    #viewer-ts-overlay{
      position:absolute;bottom:14px;left:16px;z-index:8;font-size:9px;
      letter-spacing:1px;color:rgba(0,221,85,.6);pointer-events:none;
      text-shadow:0 0 8px rgba(0,221,85,.4);display:none;
    }

    @media(max-width:700px){
      #layout{flex-direction:column}
      #cam-list-panel{width:100%;height:220px;border-right:none;border-bottom:1px solid var(--border-bright)}
      #cam-list{display:flex;overflow-x:auto;overflow-y:hidden;gap:8px;padding:8px;flex-direction:row}
      .cam-card{min-width:180px;margin-bottom:0}
    }
  </style>
</head>
<body>

<div id="top-bar">
  <span class="tb-brand">VOID<span>.</span>SYS</span>
  <a href="index.html">← BACK</a>
  <div class="rec-badge"><span class="rec-dot"></span>REC // LIVE FEEDS</div>
</div>

<div id="layout">

  <!-- LEFT: Camera List -->
  <div id="cam-list-panel">
    <div id="filter-bar">
      <button class="flt active" data-f="all">ALL</button>
      <button class="flt" data-f="city">CITY</button>
      <button class="flt" data-f="nature">NATURE</button>

    </div>

    <div id="cam-list"></div>

  <!-- RIGHT: Main Viewer -->
  <div id="viewer-panel">
    <div id="viewer-header">
      <div>
        <div id="viewer-title">SELECT A FEED</div>
        <div id="viewer-meta">AWAITING SIGNAL —</div>
      </div>
      <div id="viewer-ts">—</div>
      <div id="viewer-actions">
        <button class="vbtn" id="btn-fullscreen">⛶ FULLSCREEN</button>
        <button class="vbtn" id="btn-newtab">⊕ OPEN SOURCE</button>
        <button class="vbtn" id="btn-retry">↻ RECONNECT</button>
      </div>
    </div>
    <div id="viewer-screen">
      <!-- Idle -->
      <div id="viewer-idle">
        <div class="idle-grid">
          <div class="idle-cell">01</div><div class="idle-cell">02</div><div class="idle-cell">03</div>
          <div class="idle-cell">04</div><div class="idle-cell">05</div><div class="idle-cell">06</div>
        </div>
        <div class="idle-title">EYES OF THE WORLD</div>

      <!-- Loading -->

      <div id="viewer-lost">
        <div class="vl-lost-icon">📡</div>

        <div class="vl-lost-sub">FEED UNAVAILABLE OR BLOCKED BY ORIGIN SERVER</div>
        <div class="vl-lost-actions">
          <button class="vl-lost-btn primary" id="btn-search-yt">🔍 SEARCH ON YOUTUBE</button>
          <button class="vl-lost-btn secondary" id="btn-retry-lost">↻ RETRY CONNECTION</button>
        </div>
      </div>
      <!-- Iframe -->
      <iframe id="viewer-frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
      <!-- Overlays -->
      <div id="viewer-scanlines"></div>
      <div class="vbracket tl"></div><div class="vbracket tr"></div>
      <div class="vbracket bl"></div><div class="vbracket br"></div>
      <div id="viewer-ts-overlay">—</div>
    </div>
  </div>

</div>

<script>
(() => {
  'use strict';

  // ─────────────────────────────────────────
  // CAMERA DATABASE
  // Sources: EarthCam YouTube channel streams,
  //          explore.org channel live streams,
  //          verified 24/7 public webcam channels
  // ─────────────────────────────────────────
  const CAMS = [

    { id:'C001', name:'TIMES SQUARE', loc:'New York, USA', cat:'city',

    { id:'C004', name:'PARIS — EIFFEL TOWER', loc:'Paris, France', cat:'city',

      search:'paris eiffel tower live cam', direct:'https://www.youtube.com/watch?v=OzYp4NRZlwQ' },
    { id:'C005', name:'DUBAI MULTICAM', loc:'Dubai, UAE', cat:'city',
      src:'https://www.youtube.com/embed/oxT5R6I0N6E?autoplay=1&mute=1',
      search:'dubai live webcam 24/7', direct:'https://www.youtube.com/watch?v=oxT5R6I0N6E' },
    { id:'C006', name:'NYC SKYLINE', loc:'New York, USA', cat:'city',
      src:'https://www.youtube.com/embed/_-Qg5jD-PfA?autoplay=1&mute=1',
      search:'new york city live skyline cam', direct:'https://www.youtube.com/watch?v=_-Qg5jD-PfA' },
    // NATURE — verified live stream IDs
    { id:'N001', name:'NIAGARA FALLS', loc:'Ontario, Canada', cat:'nature',

    { id:'N002', name:'MPALA WATERING HOLE', loc:'Kenya, Africa', cat:'nature',
      src:'https://www.youtube.com/embed/oORXfTviuCs?autoplay=1&mute=1',
      search:'mpala watering hole kenya live', direct:'https://www.youtube.com/watch?v=oORXfTviuCs' },
    { id:'N003', name:'NAMIBIA DESERT', loc:'Namib Desert, Namibia', cat:'nature',
      src:'https://www.youtube.com/embed/ydYDqZQpim8?autoplay=1&mute=1',
      search:'namibia desert live cam wildlife', direct:'https://www.youtube.com/watch?v=ydYDqZQpim8' },
    { id:'N004', name:'EXPLORE.ORG REEF', loc:'Tropical Ocean', cat:'nature',
      src:'https://www.youtube.com/embed/DHUnz4dyb54?autoplay=1&mute=1',
      search:'explore org coral reef live cam', direct:'https://www.youtube.com/watch?v=DHUnz4dyb54' },
    // WILDLIFE — verified live IDs
    { id:'W001', name:'WILD AFRICA SAFARI', loc:'Africa (Multiple Cams)', cat:'wildlife',
      src:'https://www.youtube.com/embed/qpukdDslCjk?autoplay=1&mute=1',
      search:'africa safari live wildlife cam 24/7', direct:'https://www.youtube.com/watch?v=qpukdDslCjk' },
    { id:'W002', name:'POLAR BEAR CAM', loc:'Kansas City Zoo, USA', cat:'wildlife',
      src:'https://www.youtube.com/embed/BSUnBPvX9K4?autoplay=1&mute=1',
      search:'polar bear live cam zoo 24/7', direct:'https://www.youtube.com/watch?v=BSUnBPvX9K4' },
    // TRAFFIC
    { id:'T001', name:'NYC LIVE CAMS', loc:'New York, USA', cat:'traffic',
      src:'https://www.youtube.com/embed/rnXIjl_Rzy4?autoplay=1&mute=1&start=10',
      search:'nyc traffic live cam 24/7', direct:'https://www.youtube.com/results?search_query=nyc+traffic+live+cam' },
    { id:'T002', name:'TOKYO STREETS', loc:'Tokyo, Japan', cat:'traffic',
      src:'https://www.youtube.com/embed/dfVK7ld38Ys?autoplay=1&mute=1&start=5',
      search:'tokyo live traffic cam 24/7', direct:'https://www.youtube.com/results?search_query=tokyo+traffic+live' },
    // BEACH
    { id:'B001', name:'BONDI BEACH', loc:'Sydney, Australia', cat:'beach',
      src:'https://www.youtube.com/embed/hm9iAviOZ20?autoplay=1&mute=1',
      search:'bondi beach live webcam 24/7', direct:'https://www.youtube.com/watch?v=hm9iAviOZ20' },
    { id:'B002', name:'MIAMI SOUTH BEACH', loc:'Miami, USA', cat:'beach',
      src:'https://www.youtube.com/embed/IKbsdBomCsI?autoplay=1&mute=1',
      search:'miami south beach live webcam 24/7', direct:'https://www.youtube.com/watch?v=IKbsdBomCsI' },
  ];

  // ─────────────────────────────────────────
  // STATE
  // ─────────────────────────────────────────
  let activeCam = null;
  let loadTimer = null;
  let lostTimer = null;
  let tsInterval = null;

  const elList      = document.getElementById('cam-list');
  const elCount     = document.getElementById('feed-count');
  const elIdle      = document.getElementById('viewer-idle');
  const elLoading   = document.getElementById('viewer-loading');
  const elLost      = document.getElementById('viewer-lost');
  const elFrame     = document.getElementById('viewer-frame');
  const elTitle     = document.getElementById('viewer-title');
  const elMeta      = document.getElementById('viewer-meta');
  const elTs        = document.getElementById('viewer-ts');
  const elTsOvl     = document.getElementById('viewer-ts-overlay');
  const elBar       = document.getElementById('vl-bar-fill');

  // ─────────────────────────────────────────
  // RENDER CAMERA LIST
  // ─────────────────────────────────────────
  function renderList(cams) {
    elList.innerHTML = '';
    elCount.textContent = cams.length;
    cams.forEach(cam => {
      const card = document.createElement('div');
      card.className = 'cam-card';
      card.dataset.id = cam.id;
      card.dataset.cat = cam.cat;
      card.innerHTML = `
        <div class="cc-preview">
          <div class="cc-static">
            <div class="cc-static-icon">📷</div>
            <div class="cc-static-txt">SCANNING…</div>
          </div>
          <div class="cc-noise"></div>
          <div class="cc-scan-line"></div>
          <div class="cc-scanlines"></div>
          <div class="cc-overlay">
            <div class="cc-top">
              <span class="cc-id">${cam.id}</span>
              <span class="cc-live"><span class="cc-live-dot"></span>LIVE</span>
            </div>
            <div class="cc-bottom">
              <div class="cc-name">${cam.name}</div>
              <div class="cc-loc">${cam.loc}</div>
            </div>
          </div>
          <div class="cc-cat">${cam.cat.toUpperCase()}</div>
        </div>
      `;
      card.addEventListener('click', () => loadCam(cam, card));
      elList.appendChild(card);
    });
  }

  // ─────────────────────────────────────────
  // LOAD CAMERA IN VIEWER
  // ─────────────────────────────────────────
  function loadCam(cam, card) {
    // Deactivate all cards
    document.querySelectorAll('.cam-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    activeCam = cam;

    // Reset viewer
    clearTimers();
    elIdle.style.display = 'none';
    showLoading(true);
    hideLost();
    elFrame.classList.remove('loaded');
    elTsOvl.style.display = 'none';

    // Update header
    elTitle.textContent = cam.name;
    elMeta.textContent = `${cam.loc} // ${cam.cat.toUpperCase()} // ${cam.id}`;

    // Load iframe
    elFrame.src = '';
    elFrame.src = cam.src;

    // On load success
    elFrame.onload = () => {
      clearTimers();
      showLoading(false);
      elFrame.classList.add('loaded');
      elTsOvl.style.display = 'block';
      startTimestamp();
      localStorage.setItem('void_mood', 'cctv_on');
    };

    // Timeout → signal lost after 12s
    lostTimer = setTimeout(() => {
      showLoading(false);
      showLost();
    }, 12000);
  }

  // ─────────────────────────────────────────
  // UI STATE HELPERS
  // ─────────────────────────────────────────
  function showLoading(show) {
    elLoading.style.display = show ? 'flex' : 'none';
    if (show) {
      // Restart progress bar animation
      elBar.style.animation = 'none';
      elBar.offsetHeight; // reflow
      elBar.style.animation = 'loadBar 12s linear forwards';
    }
  }
  function showLost() {
    elLost.style.display = 'flex';
    elFrame.classList.remove('loaded');
    elTsOvl.style.display = 'none';
  }
  function hideLost() {
    elLost.style.display = 'none';
  }
  function clearTimers() {
    if (lostTimer) clearTimeout(lostTimer);
    if (tsInterval) clearInterval(tsInterval);
  }
  function startTimestamp() {
    const tick = () => {
      const now = new Date();
      const s = d => String(d).padStart(2,'0');
      const str = `${s(now.getUTCHours())}:${s(now.getUTCMinutes())}:${s(now.getUTCSeconds())} UTC`;
      elTs.textContent = str;
      elTsOvl.textContent = `[${activeCam?.id}] ${str}`;
    };
    tick();
    tsInterval = setInterval(tick, 1000);
  }

  // ─────────────────────────────────────────
  // FILTERS
  // ─────────────────────────────────────────
  document.querySelectorAll('.flt').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.flt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.f;
      const filtered = f === 'all' ? CAMS : CAMS.filter(c => c.cat === f);
      renderList(filtered);
    });
  });

  // ─────────────────────────────────────────
  // ACTION BUTTONS
  // ─────────────────────────────────────────
  document.getElementById('btn-fullscreen').addEventListener('click', () => {
    if (elFrame.requestFullscreen) elFrame.requestFullscreen();
  });
  document.getElementById('btn-newtab').addEventListener('click', () => {
    if (activeCam) window.open(activeCam.direct, '_blank', 'noopener');
  });
  document.getElementById('btn-retry').addEventListener('click', () => {
    if (activeCam) {
      const card = document.querySelector(`.cam-card[data-id="${activeCam.id}"]`);
      if (card) loadCam(activeCam, card);
    }
  });
  document.getElementById('btn-search-yt').addEventListener('click', () => {
    if (activeCam) {
      const q = encodeURIComponent(activeCam.search);
      // Filter by Live only on YouTube
      window.open(`https://www.youtube.com/results?search_query=${q}&sp=EgJAAQ%3D%3D`, '_blank', 'noopener');
    }
  });
  document.getElementById('btn-retry-lost').addEventListener('click', () => {
    hideLost();
    if (activeCam) {
      const card = document.querySelector(`.cam-card[data-id="${activeCam.id}"]`);
      if (card) loadCam(activeCam, card);
    }
  });

  // ─────────────────────────────────────────
  // INIT
  // ─────────────────────────────────────────
  renderList(CAMS);

  // Initial clock
  (() => {
    const tick = () => {
      const n = new Date();
      const s = d => String(d).padStart(2,'0');
      elTs.textContent = `${s(n.getUTCHours())}:${s(n.getUTCMinutes())}:${s(n.getUTCSeconds())} UTC`;
    };
    tick();
    setInterval(tick, 1000);
  })();

  // Reset mood strictly when page unloads
  window.addEventListener('beforeunload', () => {
    localStorage.setItem('void_mood', 'idle');
  });

})();
</script>
</body>
</html>
